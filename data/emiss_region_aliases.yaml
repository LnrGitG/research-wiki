# Соответствие названий регионов: измерение базы (core.region.name_ru) и ЕМИСС.
#
# Зачем файл: в ЕМИСС названия территорий длиннее и по-разному отделяют
# автономные округа от «материнского» региона. Два разных ряда легко перепутать,
# и тогда полный агрегат попадает под метку остаточного региона — именно это
# случилось 25.09.2026 при загрузке безработицы 43062 (исправлено 28.09.2026).
#
# Правило: сначала точное совпадение названий, затем эта карта; никаких
# нечётких подборов вроде «like %Архангельск%» — они и дают подстановку
# полного агрегата вместо остаточного.
#
# Пары «остаточный / полный»: у обоих вариантов своя метка в измерении,
# и ряд источника у них РАЗНЫЙ.


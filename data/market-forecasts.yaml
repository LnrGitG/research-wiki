# Реестр публичных прогнозов участников рынка (market-forecasts)

# Назначение: собираем точечные прогнозы от организаций и персон рынка/аналитики
# (Сбер, ВЭБ.РФ, ДОМ.РФ, ЦБ опросы, инвестбанки), чтобы позже использовать их
# как (а) внешний бенчмарк для наших наукастов инвестиций и СМР,
# (б) вход в реестр гипотез hypotheses.yaml, (в) материал для критики/синтеза.
#
# Место в пайплайне: скрейп/рукописный ingest → этот файл (append-only записи,
# каждая с датой публикации и источником) → фальсифицируемое утверждение уходит
# в hypotheses.yaml (H-запись) → проверка на реализовавшихся данных Росстата
# (ИКВ/ВНОК) → статус в обеих системах обновляется с датой. План сбора — в
# queries/prognozy-uchastnikov-rynka-plan.md.
#
# Правила:
# - forecast поля копируются ТОЧНО как в источнике, без пересчёта;
# - одна запись = один прогноз одной организации на одну дату публикации;
# - после реализации периода поле realized заполняется фактом с источником;
# - id: MF-NNN, сквозная нумерация.
schema:
  fields:
    id:            "MF-NNN"
    published:     "дата публикации прогноза (YYYY-MM-DD)"
    org:           "организация"
    person:        "персона (если названа; иначе null)"
    person_role:   "роль персоны"
    period:        "период прогноза (квартал/год)"
    target_var:    "переменная (ИКВ yoy, СМР yoy, ключевая ставка и т.п.)"
    forecast:      "точечное значение/интервал как в источнике"
    baseline:      "факт/точка отсчёта, от которой прогноз"
    hypothesis:    "механизм, который заявляет автор (дословно или близко к тексту)"
    sources:       ["url или цитируемый канал"]
    related_h:     ["связанные H-записи"]
    realized:      null или "факт с источником после реализации периода"
    realized_date: null
    verdict:       "pending | hit | miss | partial"
    tags:          []
    created:       "YYYY-MM-DD"

records:

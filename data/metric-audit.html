const tb = document.getElementById('tb');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const themes=[...new Set(D.map(d=>d.theme))].sort();
const ft=document.getElementById('fTheme');
themes.forEach(t=>{const o=document.createElement('option');o.textContent=t;ft.appendChild(o);});
document.getElementById('tot').textContent=D.length+' рядов по РФ (final)';
let sortKey=null, sortDir=1;
function render(){
  const th=ft.value, vd=document.getElementById('fVerdict').value, fq=document.getElementById('fFreq').value,
        nc=document.getElementById('fNc').value, q=document.getElementById('q').value.toLowerCase();
  let rows=D.filter(d=>(!th||d.theme===th)&&(!vd||d.verdict===vd)&&(!fq||d.freq===fq)&&(!nc||String(d.nc)===nc)&&
    (!q||(d.name+' '+d.code).toLowerCase().includes(q)));
  if(sortKey){rows=rows.slice().sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return (x>y?1:x<y?-1:0)*sortDir;});}
  tb.innerHTML=rows.map(d=>`<tr class="${d.verdict.slice(0,7).replace('?','')}">
    <td><span class="badge b-${d.verdict.slice(0,7)}">${d.verdict}</span>${d.nc?' <span class="nc" title="кандидат nowcasting">NC</span>':''}</td>
    <td><span class="nm" title="${esc(d.name)}">${esc(d.name)}</span><br><code style="color:var(--mut);font-size:11px">${esc(d.code)}</code></td>
    <td class="hide-m">${esc(d.theme)}</td><td>${esc(d.freq)}</td><td>${d.n}</td>
    <td class="hide-m">${d.first.slice(0,7)}</td><td>${d.last.slice(0,7)}</td>
    <td>${d.cv}</td><td class="hide-m">${d.ac1??'—'}</td><td class="hide-m">${d.dr}</td><td style="font-size:11px;color:var(--warn)">${esc(d.flags)}</td>
  </tr>`).join('');
  document.getElementById('st').textContent=`показано ${rows.length} из ${D.length}`;
}
document.querySelectorAll('th[data-s]').forEach(h=>h.onclick=()=>{const k=h.dataset.s;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}render();});
['fTheme','fVerdict','fFreq','fNc'].forEach(id=>document.getElementById(id).onchange=render);
document.getElementById('q').oninput=render;
render();
</script></body></html>

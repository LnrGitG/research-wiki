# Evidence-паспорта семейства ДКП-макро (партия 3 этапа 2)
# Цены, ВВП, промпроизводство, доходы, бюджет — макроконтур для ДКП-анализа.
# Источники: КЭП ind_07-2026.xlsx (листы 1.1, 1.2, 1.14, 3.1), региональные
# таблицы Росстата (y477*), socio_economic_report; живой SQL 2026-09-20.
family: dkp_macro
generated: 2026-09-20

metrics:

  kep1_14:
    definition: "ИПЦ, % к предыдущему месяцу (РФ)"
    unit: pct
    freq: M
    comparison_base: previous_period
    db_check: "2026-07=100.5, 2026-06=100.9, 2026-05=100.2"
    status: core_candidate
    notes: "месячная инфляция для трансмиссии ДКП; НЕ дубли kep1_14_s"

  kep1_14_s:
    definition: "ИПЦ, % к соответствующему месяцу прошлого года (РФ)"
    unit: pct
    freq: M
    comparison_base: same_period_last_year
    db_check: "2026-07=106.0 против 100.5 mom у kep1_14 — ДРУГАЯ база сравнения"
    status: core_candidate
    notes: "yoy-форма ИПЦ; пара к kep1_14"

  kep1_143:
    definition: "Стоимость фиксированного набора товаров и услуг, руб. (уровень), месяц"
    unit: rub (проверить в БД)
    freq: M
    status: extended_candidate
    notes: "потребительская корзина для региональной покупательной способности"

  kep1_12:
    definition: "ВВП, млрд руб., квартал (РФ)"
    unit: bln_rub
    freq: Q
    db_check: "2025-10=62354.1, 2025-07=54671.8, 2025-04=49284.8"
    status: core_candidate
    notes: "квартальный ВВП; пара kep1_1_y2 — ИФО ВВП (yoy)"

  kep1_1_y2:
    definition: "Объём ВВП, % к соотв. кварталу прошлого года (ИФО ВВП)"
    unit: pct
    freq: Q
    status: core_candidate
    notes: "темп ВВП для циклического позиционирования ДКП"

  ippsm:
    definition: "Индекс промышленного производства, % к соответствующему месяцу прошлого года"
    unit: pct
    freq: Q
    db_check: "РФ 2026-07=97.4 (subdim=''); разрезы-протечки: 'категория: …Ханты-Мансийский' (91.7), 'г. Севастополь' (40.3)"
    defect: "региональные подписи протекли в sub_dimension при region_id=1 — ДЛЯ РФ БРАТЬ ТОЛЬКО subdim=''; чинить загрузчик"
    status: core_candidate
    notes: "7457 obs: месячный по регионам фактически; секторный фон для СМР-анализа"

  kep1_2__2014_2026_m:
    definition: "ИПП без исключения сезонности, % к пред. месяцу"
    unit: pct
    freq: Q
    status: extended_candidate
    notes: "версия ряда с расщеплением методологии в имени листа (2014_2026)"

  kep3_12:
    definition: "ИЦП промышленных товаров, % (на конец периода)"
    unit: pct
    freq: M
    status: extended_candidate
    notes: "издержки стройматериалов через ИЦП; связать со prom_products_monthly из SQLite"

  snz:
    definition: "Среднемесячная начисленная зарплата, руб., месяц, регионы"
    unit: rub
    freq: M
    db_check: "РФ 2026-05=110216.2; subdim='' чистый"
    status: core_candidate
    notes: "доходная база спроса на жильё; 15120 obs, региональная панель"

  y477110111:
    definition: "ИПЦ, год, регионы (региональная таблица)"
    unit: idx (проверить)
    freq: A
    coverage: 96 регионов, 2001—2024
    status: extended_candidate
    notes: "годовая региональная инфляция для панелей"

  y477110112: {definition: "ИПЦ (тарифы) на услуги, год, регионы", freq: A, status: extended_candidate}
  y477110113: {definition: "ИПЦ на непродовольственные товары, год, регионы", freq: A, status: extended_candidate}
  y477110114: {definition: "ИПЦ на продовольственные товары, год, регионы", freq: A, status: extended_candidate}
  y477110132: {definition: "ИЦП промышленных товаров по видам деятельности, год, регионы", freq: A, status: extended_candidate}
  y477110141: {definition: "ИЦП сельхозпродукции, год, регионы", freq: A, status: extended_candidate}
  y477110394: {definition: "Стоимость фиксированного набора: субъект, год", freq: A, status: extended_candidate}
  y477110395: {definition: "Стоимость фиксированного набора: федеральный округ, год", freq: A, status: extended_candidate, notes: "4608 obs = двойная гранулярность (субъект+ФО)"}

  orspp:
    definition: "Объём работ «Строительство», % к пред. периоду (socio_economic_report)"
    freq_declared: Q
    freq_actual: M
    near_duplicate: kep1_7_m
    db_check: "2026-06=122.4 == kep1_7_m; 2026-05=104.1 == kep1_7_m; НО 2026-07: 101.1 vs 100.4 — расхождение в последней точке"
    status: needs_link
    action: "карантин не назначен: расхождение одной точки может быть ревизией релиза; сверить с ячейкой листа 1.7 (стр.92: 2026-07=100.4) — канон kep1_7_m; socio_economic_report отстаёт с ревизией"

  vzep:
    definition: "Введено промышленных зданий, единиц (РФ)"
    freq: Q
    n_obs: 1
    db_check: "единственная точка 2026-01=1353"
    status: archive_low_value
    notes: "1 наблюдение — непригоден до накопления истории; держать под мониторингом"

  vztp:
    definition: "Введено промышленных зданий, тыс. м² (РФ)"
    freq: Q
    n_obs: 1
    db_check: "2026-01=2966.9"
    status: archive_low_value

  vzepz:
    definition: "Ввод промышленных зданий, единиц (РФ, новая выгрузка)"
    freq: Q
    n_obs: 2
    db_check: "2026-03=728, 2026-06=1353; значение 1353 совпадает с точкой vzep 2026-01 — возможен сдвиг периода"
    status: needs_link
    action: "сверить с исходником: совпадение 1353 у vzep(2026-01) и vzepz(2026-06) подозрительно на сдвиг дат парсинга"

open_questions:
  - "ippsm: чинить протечку регионов в subdim при region_id=1 (загрузчик socio_economic_report)"
  - "orspp: сверить точку 2026-07 (101.1 vs 100.4) с исходником — ревизия или ошибка"
  - "vzep/vzepz: 1353 на разных датах — сдвиг парсинга или совпадение"
  - "ГЭП ДКП-контура: в каталоге НЕТ ключевой ставки, денежной массы М2, межбанковских ставок, курса — требуется подключение источников ЦБ (регулярная выгрузка ЦБ РФ), сейчас только производные ряды"

rules:
  dead_cutoff: '2024-01-01'
  min_points: 24
  note: статусы preliminary до этапа 2 (паспорта источников); архив и карантин не
    удаляются
known_defects:
  kep1_112:
    defect: fictitious_frequency
    evidence: ind_07-2026.xlsx лист 1.11, кумулятивный блок; в БД freq_id=5 (месячная)
      при годовых значениях колонки «Янв.»
    action: quarantine до перепаспортизации на этапе 2
  spv:
    defect: freq_conflict_declared_vs_obs
    evidence: 'core.metric.frequency_id=3 (годовая), наблюдения: 5 строк frequency_id=5
      за period_start=2026-08-01 (SQL 2026-09-20)'
    action: quarantine до выяснения природы «Сводного показателя» на этапе 2
  kep4_45:
    defect: future_periods
    evidence: 3 наблюдения 2026-10..2026-12 при дате генерации 2026-09-20 — вероятен
      сдвиг годового блока листа 4.5 при парсинге
    action: quarantine до сверки листа с исходником
  kep4_46:
    defect: future_periods
    evidence: 1 наблюдение 2026-10 при дате генерации 2026-09-20 — вероятен сдвиг
      годового блока листа 4.6 при парсинге
    action: quarantine до сверки листа с исходником
  orsmr:
    defect: duplicate_plus_fictitious_freq
    evidence: 'SQL 2026-09-20: значения == kep1_72 (2026-07=1790.5, 2026-06=1770.5,
      2026-05=1437.6), периоды месячные при declared Q; источник socio_economic_report'
    action: канонический ряд — kep1_72; см. passports/smr-ikv.yaml
  orssp:
    defect: duplicate_plus_fictitious_freq
    evidence: 'SQL 2026-09-20: значения == kep1_7_y2 (2026-07=100.8, 2026-06=103.5,
      2026-05=95.6), периоды месячные при declared Q'
    action: канонический ряд — kep1_7_y2; см. passports/smr-ikv.yaml
  ebs:
    defect: scale_mixture_in_one_series
    evidence: 'SQL 2026-09-20, РФ: 2022-2024 ~0.31-1.65 млн; 2025-01—2026-01 ~9.4-10.7
      (другая величина); 2026-02+ ~7.25 млн — три эпохи с разрывами 10^5; см. passports/mortgage-escrow.yaml'
    action: карантин до перезагрузки раздельными рядами; бенчмарки H-007 строились
      из SQLite escrow_monthly — не затронуты
  spsipflrrtmrsrf:
    defect: duplicate
    evidence: 'SQL 2026-09-20: значения идентичны sit (2026-01..03: 7.64/9.99/10.04)'
    action: канонический ряд — sit

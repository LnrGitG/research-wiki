# Реестр обновления источников (единая точка правды о том, что и когда обновляется).
#
# Зачем: cron-джобов мало, а позиций в реестре источников владельца много; расхождение
# закрывается не новым джобом, а строкой в этом файле. Планировщик (scripts/source_updates.py)
# читает реестр, берёт состояние авто-джобов из ~/.hermes/cron/jobs.json и показывает, что
# просрочено.
#
# Поля:
#   code        — короткий код источника (латиница)
#   title       — что обновляется
#   kind        — auto (джоб Hermes) | remind (напоминание владельцу) | manual (руками, без даты)
#   cron_job_id — идентификатор авто-джоба, если есть
#   cron        — расписание (дублирует джоб для наглядности и для kind без джоба)
#   cadence     — ожидаемая периодичность: daily | weekly | monthly | quarterly | annual
#   script      — чем обновляется (для auto/remind)
#   last_ok     — дата последнего подтверждённого обновления (заполняется вручную или джобом)
#   url         — страница источника
#   target      — куда ложатся данные в базе/репозитории

version: 1
updated: 2026-09-28


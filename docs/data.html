<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<title>📊 Данные | Research Wiki</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e0e0e0;padding:12px;max-width:900px;margin:0 auto}
h1{font-size:1.3rem;margin-bottom:8px;background:linear-gradient(90deg,#4fc3f7,#81c784);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#888;font-size:0.8rem;margin-bottom:12px}
.back{font-size:0.8rem;margin-bottom:10px;display:inline-block;color:#4fc3f7;text-decoration:none}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;position:sticky;top:0;background:#0f1117;padding:4px 0;z-index:10}
.tab{padding:6px 12px;font-size:0.8rem;background:#1a1d29;border:1px solid #2a2d3a;border-radius:8px;cursor:pointer;color:#888}
.tab.active{background:#2a3a4a;border-color:#4fc3f7;color:#4fc3f7}
.chart-card{background:#1a1d29;border:1px solid #2a2d3a;border-radius:12px;padding:16px;margin-bottom:16px}
.chart-card h2{font-size:0.95rem;color:#81c784;margin-bottom:10px}
canvas{max-height:350px!important}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:#1a1d29;border:1px solid #2a2d3a;border-radius:8px;padding:8px 12px;text-align:center}
.stat .val{font-size:1.2rem;font-weight:700;color:#4fc3f7}
.stat .label{font-size:0.7rem;color:#888;margin-top:2px}
.stat.green .val{color:#81c784}
.stat.red .val{color:#ef5350}
.stat.orange .val{color:#ffb74d}
table{width:100%;border-collapse:collapse;font-size:0.8rem;margin-top:8px}
th{background:#222531;padding:6px;text-align:left;color:#4fc3f7;border-bottom:2px solid #2a3a4a;position:sticky;top:0}
td{padding:5px 8px;border-bottom:1px solid #222531;color:#b0bec5}
tr:active{background:#1e2130}
.table-card{background:#1a1d29;border:1px solid #2a2d3a;border-radius:12px;padding:16px;overflow-x:auto;margin-bottom:16px}
.search-hint{background:#1a1d29;border:1px solid #2a2d3a;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.8rem;color:#888}
.search-hint a{color:#4fc3f7}
</style>
</head>
<body>

<a href="index.html" class="back">← Главная</a>
<h1>📊 Статистика жилищного строительства</h1>
<p class="subtitle">Росстат · ДОМ.РФ · 11 рядов · 56 КБ</p>

<div class="search-hint">
🧠 <a href="vector-search.html">Векторный поиск</a> — найдёт статьи по теме.
📊 Здесь — количественные данные из базы (rosstat_construction.db).
</div>

<div class="tabs" id="tabs"></div>
<div id="content"></div>

<script>
let DATA=null;
const SERIES={
'input':{'name':'Ввод жилья','icon':'🏠'},
'prices_a':{'name':'Цены (годовые)','icon':'💰'},
'prices_q':{'name':'Цены (квартальные)','icon':'📈'},
'completions':{'name':'Ввод зданий','icon':'🏗️'},
'unfinished':{'name':'Незавершённое','icon':'⏳'},
'employment':{'name':'Занятость','icon':'👷'},
'materials':{'name':'Материалы','icon':'🧱'},
'materials_m':{'name':'Материалы (мес)','icon':'📉'},
'gdelt':{'name':'Новостной тон','icon':'📰'},
'machinery':{'name':'Техника','icon':'🚜'},
'ddu':{'name':'ДДУ (ДОМ.РФ)','icon':'📋'},
'permits':{'name':'РНС (ДОМ.РФ)','icon':'📄'},
'regional':{'name':'Регионы 2023','icon':'🗺️'},
'domrf_index':{'name':'Индекс ДОМ.РФ','icon':'📊'},
'rosstat_q':{'name':'Цены Росстат (кв)','icon':'🏛️'},
'ind_saar':{'name':'Пром. производство','icon':'🏭'},
'ind_reg':{'name':'Пром. по регионам','icon':'⚙️'},
'vvod_reg':{'name':'Ввод жилья (рег)','icon':'🏢'},
'backlog':{'name':'Незавершёнка','icon':'🏗️'},
'fns':{'name':'ФНС опендата','icon':'💰'},
'ws_infl':{'name':'Внимание: инфляция','icon':'🔍'},
'ws_infl_reg':{'name':'Инфляция: регионы','icon':'🗺️'},
'ws_housing':{'name':'Внимание: цены жилья','icon':'🏠'},
};

function initTabs(){
const tabs=document.getElementById('tabs');
tabs.innerHTML=Object.entries(SERIES).map(([k,v])=>
`<div class="tab" data-key="${k}">${v.icon} ${v.name}</div>`).join('');
tabs.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
t.classList.add('active');
render(t.dataset.key);
}));
}

function render(key){
const c=document.getElementById('content');
const D=DATA;

if(key==='vvod_reg'){
const d=D.housing_input_annual||{};
const rf=d.rf_series||[];
const top=d.top_regions_2020_2024||[];
const latest=rf[rf.length-1], peak=rf.reduce((a,b)=>b.value>a.value?b:a);
let html=`<div class="stats">
<div class="stat"><div class="val">${peak.value}</div><div class="label">Пик РФ (${peak.year})</div></div>
<div class="stat green"><div class="val">${latest.value}</div><div class="label">${latest.year}</div></div>
</div>
<div class="chart-card"><h2>РФ: ввод жилья, млн м² 2000–2024</h2><canvas id="chv"></canvas></div>
<div class="table-card"><h2>Топ-15 регионов 2020–2024 (млн м²)</h2><table><tr><th>Регион</th><th>млн м²</th></tr>
${top.map(x=>`<tr><td>${x.region}</td><td>${x.sum_mln_m2}</td></tr>`).join('')}</table></div>`;
c.innerHTML=html;
new Chart(document.getElementById('chv'),{type:'line',data:{labels:rf.map(x=>x.year),
datasets:[{label:'млн м²',data:rf.map(x=>x.value),borderColor:'#4fc3f7',tension:.3,pointRadius:2}]},options:{plugins:{legend:{display:false}}}});
return;}
if(key==='backlog'){
const b=D.housing_backlog_ratio||{}; const s=b.rf_series||[];
c.innerHTML=`<div class="chart-card"><h2>Незавершённое строительство / годовой ввод (РФ)</h2><canvas id="chb"></canvas></div>
<div class="search-hint">Отношение общей площади незавершённых жилых домов к годовому вводу. Рост = стройки затягиваются.</div>`;
new Chart(document.getElementById('chb'),{type:'line',data:{labels:s.map(x=>x.year),
datasets:[{label:'ratio',data:s.map(x=>x.ratio),borderColor:'#ffb74d',tension:.3,pointRadius:2}]},options:{plugins:{legend:{display:false}}}});
return;}
if(key==='input'){
const d=D.housing_input_annual;
const latest=d[d.length-1],peak=d.reduce((a,b)=>b.value>a.value?b:a);
c.innerHTML=`<div class="stats">
<div class="stat"><div class="val">${peak.value}</div><div class="label">Пик (${peak.year})</div></div>
<div class="stat green"><div class="val">${latest.value}</div><div class="label">${latest.year}</div></div>
</div>
<div class="chart-card"><h2>Ввод жилья, млн м² (1990–2021)</h2>
<canvas id="ch"></canvas></div>`;
new Chart(document.getElementById('ch'),{type:'bar',data:{
labels:d.map(x=>x.year),
datasets:[{label:'млн м²',data:d.map(x=>x.value),backgroundColor:'#4fc3f7',borderRadius:3}]
},options:{plugins:{legend:{display:false}}}});
}

else if(key==='prices_a'){
const p=D.housing_prices_annual.filter(x=>x.market==='primary');
const s=D.housing_prices_annual.filter(x=>x.market==='secondary');
c.innerHTML=`<div class="chart-card"><h2>Цены на жильё, тыс.руб./м² (2000–2023)</h2>
<canvas id="ch"></canvas></div>`;
new Chart(document.getElementById('ch'),{type:'line',data:{
labels:p.map(x=>x.year),
datasets:[
{label:'Первичный',data:p.map(x=>x.price),borderColor:'#4fc3f7',tension:0.3,fill:false},
{label:'Вторичный',data:s.map(x=>x.price),borderColor:'#81c784',tension:0.3,fill:false}
]}});
}

else if(key==='prices_q'){
const d=D.housing_prices_quarterly;
const labels=[...new Set(d.map(x=>`${x.year} Q${x.q}`))];
const p=d.filter(x=>x.market==='primary');
const s=d.filter(x=>x.market==='secondary');
c.innerHTML=`<div class="chart-card"><h2>Цены квартальные, тыс.руб./м² (2016–2026)</h2>
<canvas id="ch"></canvas></div>`;
new Chart(document.getElementById('ch'),{type:'line',data:{
labels:labels,
datasets:[
{label:'Первичный',data:p.map(x=>x.price),borderColor:'#4fc3f7',tension:0.3},
{label:'Вторичный',data:s.map(x=>x.price),borderColor:'#81c784',tension:0.3}
]}});
}

else if(key==='completions'){
const d=D.building_completions;
const years=[...new Set(d.map(x=>x.year))];
const counts=d.filter(x=>x.indicator.includes('count'));
c.innerHTML=`<div class="chart-card"><h2>Введено зданий (2000–2024)</h2>
<canvas id="ch"></canvas></div>`;
new Chart(document.getElementById('ch'),{type:'bar',data:{
labels:years,
datasets:[{label:'Зданий',data:counts.map(x=>x.value),backgroundColor:'#81c784'}]
},options:{plugins:{legend:{display:false}}}});
}

else if(key==='unfinished'){
const d=D.unfinished_construction;
const years=[...new Set(d.map(x=>x.year))];
const b=d.filter(x=>x.indicator==='unfinished_buildings_count');
const h=d.filter(x=>x.indicator==='unfinished_houses_count');
c.innerHTML=`<div class="chart-card"><h2>Незавершённое строительство (2000–2024)</h2>
<canvas id="ch"></canvas></div>`;
new Chart(document.getElementById('ch'),{type:'line',data:{
labels:years,
datasets:[
{label:'Здания',data:b.map(x=>x.value),borderColor:'#ef5350'},
{label:'Жилые дома',data:h.map(x=>x.value),borderColor:'#ffb74d'}
]}});
}

else if(key==='employment'){
const d=D.construction_employment;
c.innerHTML=`<div class="chart-card"><h2>Занятость в строительстве, тыс. чел.</h2>
<canvas id="ch"></canvas></div>`;
new Chart(document.getElementById('ch'),{type:'bar',data:{
labels:d.map(x=>x.year),
datasets:[{label:'Тыс. чел.',data:d.map(x=>x.emp),backgroundColor:'#4fc3f7'}]
},options:{plugins:{legend:{display:false}}}});
}

else if(key==='materials'){
const products=[...new Set(D.materials_production.map(x=>x.product))];
const years=[...new Set(D.materials_production.map(x=>x.year))];
c.innerHTML=`<div class="chart-card"><h2>Производство материалов (по годам)</h2>
<select id="prod" style="padding:8px;background:#1a1d29;border:1px solid #2a2d3a;color:#e0e0e0;border-radius:6px;width:100%">
${products.map(p=>`<option value="${p}">${p}</option>`).join('')}
</select>
<canvas id="ch" style="margin-top:10px"></canvas></div>`;
function drawMat(prod){
const d=D.materials_production.filter(x=>x.product===prod);
new Chart(document.getElementById('ch'),{type:'bar',data:{
labels:d.map(x=>x.year),datasets:[{label:prod,data:d.map(x=>x.value),backgroundColor:'#81c784'}]
},options:{plugins:{legend:{display:false}}}});
}
drawMat(products[0]);
document.getElementById('prod').addEventListener('change',e=>{
document.getElementById('ch').remove();
const cv=document.createElement('canvas');cv.id='ch';
document.querySelector('.chart-card').appendChild(cv);
drawMat(e.target.value);
});
}

else if(key==='materials_m'){
if(!D.materials_monthly||!D.materials_monthly.length){
c.innerHTML='<div class="chart-card"><h2>Нет данных</h2></div>';return;}
const products=[...new Set(D.materials_monthly.map(x=>x.product))];
const units=D.materials_monthly_units||{};
c.innerHTML=`<div class="chart-card"><h2>Производство стройматериалов, помесячно (Росстат)</h2>
<select id="prodm" style="padding:8px;background:#1a1d29;border:1px solid #2a2d3a;color:#e0e0e0;border-radius:6px;width:100%">
${products.map(p=>`<option value="${p}">${p} (${units[p]||''})</option>`).join('')}
</select>
<canvas id="chm" style="margin-top:10px"></canvas></div>`;
function drawMatM(prod){
const d=D.materials_monthly.filter(x=>x.product===prod);
const labels=d.map(x=>x.date.slice(0,7));
new Chart(document.getElementById('chm'),{type:'line',data:{
labels:labels,
datasets:[{label:prod,data:d.map(x=>x.value),borderColor:'#4fc3f7',backgroundColor:'#4fc3f722',fill:true,pointRadius:0,tension:0.2}]
},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:10}}}}});
}
drawMatM(products[0]);
document.getElementById('prodm').addEventListener('change',e=>{
document.getElementById('chm').remove();
const cv=document.createElement('canvas');cv.id='chm';
document.querySelector('.chart-card').appendChild(cv);
drawMatM(e.target.value);
});
}

else if(key==='gdelt'){
if(!D.gdelt_sentiment_weekly||!D.gdelt_sentiment_weekly.length){
c.innerHTML='<div class="chart-card"><h2>Нет данных</h2></div>';return;}
const w=D.gdelt_sentiment_weekly,m=D.gdelt_sentiment_monthly;
const zw=w.reduce((a,b)=>b.tone_z>a.tone_z?b:a);
const zmin=w.reduce((a,b)=>b.tone_z<a.tone_z?b:a);
const latest=w[w.length-1];
c.innerHTML=`<div class="stats">
<div class="stat red"><div class="val">${zmin.tone_z}</div><div class="label">Мин. тон-z (${zmin.week.slice(0,7)})</div></div>
<div class="stat green"><div class="val">${zw.tone_z}</div><div class="label">Макс. тон-z (${zw.week.slice(0,7)})</div></div>
<div class="stat"><div class="val">${latest.tone_z}</div><div class="label">Последняя неделя</div></div>
</div>
<div class="chart-card"><h2>GDELT: тональность новостей жилья/ипотеки РФ, z-score (недели)</h2>
<canvas id="chg"></canvas></div>
<div class="chart-card"><h2>Средняя тон-оценка, помесячно</h2>
<canvas id="chgm" style="margin-top:10px"></canvas></div>`;
new Chart(document.getElementById('chg'),{type:'line',data:{
labels:w.map(x=>x.week),
datasets:[
{label:'Тон z-score',data:w.map(x=>x.tone_z),borderColor:'#4fc3f7',backgroundColor:'#4fc3f722',fill:true,pointRadius:0,tension:0.2},
{label:'Объём (норм.)',data:w.map(x=>x.vol),borderColor:'#ce93d8',borderDash:[4,3],pointRadius:0,tension:0.3,yAxisID:'y1'}
]
},options:{plugins:{legend:{labels:{boxWidth:10,font:{size:10}}}},scales:{
x:{ticks:{maxTicksLimit:8}},
y:{title:{display:true,text:'Тон z'}},
y1:{position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'Vol'}}
}}});
new Chart(document.getElementById('chgm'),{type:'bar',data:{
labels:m.map(x=>x.month),
datasets:[{label:'Тон, мес.',data:m.map(x=>x.tone),backgroundColor:x=>x.raw>0?'#81c784':'#ef5350'}]
},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:12}}}}});
}

else if(key==='machinery'){
const d=D.machinery_park;
const types=[...new Set(d.map(x=>x.type))];
const years=[...new Set(d.map(x=>x.year))];
c.innerHTML=`<div class="chart-card"><h2>Парк строительной техники</h2>
<canvas id="ch"></canvas></div>`;
new Chart(document.getElementById('ch'),{type:'bar',data:{
labels:years,
datasets:types.map((t,i)=>({
label:t,data:d.filter(x=>x.type===t).map(x=>x.count),
borderColor:['#4fc3f7','#81c784','#ffb74d','#ef5350','#ce93d8'][i%5],
backgroundColor:['#4fc3f7','#81c784','#ffb74d','#ef5350','#ce93d8'][i%5]+'33'
}))
}});
}

else if(key==='ddu'){
const d=D.ddu_monthly;
c.innerHTML=`<div class="chart-card"><h2>ДДУ (ДОМ.РФ), помесячно</h2>
<canvas id="ch"></canvas></div>`;
new Chart(document.getElementById('ch'),{type:'line',data:{
labels:d.map(x=>x.date),
datasets:[{label:'ДДУ',data:d.map(x=>x.value),borderColor:'#4fc3f7',tension:0.3}]
},options:{plugins:{legend:{display:false}}}});
}

else if(key==='permits'){
const d=D.permits_monthly;
c.innerHTML=`<div class="chart-card"><h2>РНС — разрешения на строительство (ДОМ.РФ)</h2>
<canvas id="ch"></canvas></div>`;
new Chart(document.getElementById('ch'),{type:'line',data:{
labels:d.map(x=>x.date),
datasets:[{label:'РНС',data:d.map(x=>x.value),borderColor:'#81c784',tension:0.3}]
},options:{plugins:{legend:{display:false}}}});
}

else if(key==='regional'){
const d=D.regional_prices_2023;
const p=d.filter(x=>x.market==='primary').sort((a,b)=>b.price-a.price);
c.innerHTML=`<div class="table-card"><h2>Цены 2023 по регионам (первичный рынок)</h2>
<table><thead><tr><th>Регион</th><th>тыс.руб./м²</th></tr></thead><tbody>
${p.slice(0,30).map(x=>`<tr><td>${x.region}</td><td style="color:#4fc3f7">${x.price}</td></tr>`).join('')}
</tbody></table></div>`;
}

else if(key==='domrf_index'){
const rf=D.domrf_price_index_rf||[];
const all=D.domrf_price_index||[];
if(!rf.length){c.innerHTML='<p style="color:#ffb74d;padding:16px">Нет данных индекса ДОМ.РФ</p>';return;}
const last=rf[rf.length-1];
const sel=`<select id="regsel" style="width:100%;max-width:320px;padding:10px;font-size:15px;background:#16213e;color:#e0e0e0;border:1px solid #30365e;border-radius:8px;margin:10px 0"></select>`;
const regions=[...new Set(all.map(x=>x.region))];
c.innerHTML=`<div class="chart-card"><h2>Индекс цен на новостройки ДОМ.РФ (сделки, 01.2021=100)</h2>
<p style="color:#9aa0c0;font-size:13px">Последний месяц: ${last.month.slice(0,7)} · РФ ${last.index} (${last.mom>=0?'+':''}${last.mom.toFixed(2)}% м/м)</p>
${sel}<canvas id="ch"></canvas></div>`;
const selEl=document.getElementById('regsel');
regions.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;if(r==='Российская Федерация')o.selected=true;selEl.appendChild(o);});
let chart=null;
const draw=()=>{
const reg=selEl.value, d=all.filter(x=>x.region===reg);
const cfg={type:'line',data:{labels:d.map(x=>x.month.slice(0,7)),datasets:[
{label:'Индекс',data:d.map(x=>x.index),borderColor:'#4fc3f7',tension:0.3,pointRadius:0}]},
options:{plugins:{legend:{display:true,labels:{color:'#e0e0e0'}}},scales:{x:{ticks:{color:'#9aa0c0',maxTicksLimit:10},callback:{}}},interaction:{mode:'index',intersect:false}}};
if(chart)chart.destroy();
chart=new Chart(document.getElementById('ch'),cfg);
};
selEl.addEventListener('change',draw);
draw();
}

else if(key==='rosstat_q'){
const d=D.rosstat_prices_q_rf||[];
if(!d.length){c.innerHTML='<p style="color:#ffb74d;padding:16px">Нет данных</p>';return;}
const years=[...new Set(d.map(x=>x.year))];
const mkt=['primary','secondary'];
const names={primary:'Первичный рынок',secondary:'Вторичный рынок'};
const colors={primary:'#4fc3f7',secondary:'#ffb74d'};
c.innerHTML=`<div class="chart-card"><h2>Средняя цена 1 м² по РФ, конец квартала (тыс. руб., Росстат)</h2>
<canvas id="ch"></canvas></div>`;
new Chart(document.getElementById('ch'),{type:'line',data:{
labels:[...new Set(d.map(x=>`${x.year} ${x.q.replace(' квартал','')}`))],
datasets:mkt.map(m=>{const ys=new Set();const map={};d.filter(x=>x.market===m).forEach(x=>{map[`${x.year} ${x.q.replace(' квартал','')}`]=x.price});return {label:names[m],data:[...new Set(d.map(x=>`${x.year} ${x.q.replace(' квартал','')}`))].map(k=>map[k]??null),borderColor:colors[m],tension:0.3,pointRadius:2,spanGaps:true}})},options:{plugins:{legend:{labels:{color:'#e0e0e0'}}},scales:{x:{ticks:{color:'#9aa0c0',maxTicksLimit:12}}}}});
}

else if(key==='ind_saar'){
const saar=D.ind_prod_saar_rf||[];
const sections={'B_mining':'Добыча','C_manufacturing':'Обработка','D_energy':'Электроэнергия','E_water':'Водоснабжение'};
if(!saar.length){c.innerHTML='<p style="color:#ffb74d;padding:16px">Нет данных</p>';return;}
const last=saar[saar.length-1];
c.innerHTML=`<div class="chart-card"><h2>Индекс промышленного производства (Росстат, SAAR)</h2>
<p style="color:#9aa0c0;font-size:13px">Последний месяц: ${last.month.slice(0,7)} · ${last.mom_saar>=0?'+':''}${last.mom_saar.toFixed(1)}% м/м (сезонно сглаженный), фактический ${last.mom_fact>=0?'+':''}${(last.mom_fact||0).toFixed(1)}%</p>
<canvas id="ch1"></canvas></div>
<div class="chart-card"><h2>По видам деятельности, SAAR % м/м</h2>
<canvas id="ch2"></canvas></div>`;
const labels=saar.map(x=>x.month.slice(0,7));
new Chart(document.getElementById('ch1'),{type:'line',data:{labels,datasets:[
{label:'Фактически, % м/м',data:saar.map(x=>x.mom_fact),borderColor:'#ef5350',tension:0.3,pointRadius:1},
{label:'Сезонно сглаженный, % м/м',data:saar.map(x=>x.mom_saar),borderColor:'#4fc3f7',tension:0.3,pointRadius:1}]},
options:{plugins:{legend:{labels:{color:'#e0e0e0'}}},scales:{x:{ticks:{color:'#9aa0c0',maxTicksLimit:12}}}}});
const sLabels=saar.map(x=>x.month.slice(0,7));
new Chart(document.getElementById('ch2'),{type:'line',data:{labels:sLabels,datasets:Object.entries(sections).map(([k,nm],i)=>{
const s=D['ind_prod_saar_'+k]||[];const map={};s.forEach(x=>map[x.month.slice(0,7)]=x.mom_saar);
return {label:nm,data:labels.map(l=>map[l]??null),borderColor:['#81c784','#ffb74d','#ce93d8','#4dd0e1'][i],tension:0.3,pointRadius:0,spanGaps:true}})},
options:{plugins:{legend:{labels:{color:'#e0e0e0'}}},scales:{x:{ticks:{color:'#9aa0c0',maxTicksLimit:12}}}}});
}

else if(key==='ind_reg'){
const rf=D.ind_prod_yoy_rf||[];
const all=D.ind_prod_regions_yoy||[];
if(!rf.length){c.innerHTML='<p style="color:#ffb74d;padding:16px">Нет данных</p>';return;}
const lastM=rf[rf.length-1].month;
const regions=[...new Set(all.map(x=>x.region))];
const sel=`<select id="regsel2" style="width:100%;max-width:320px;padding:10px;font-size:15px;background:#16213e;color:#e0e0e0;border:1px solid #30365e;border-radius:8px;margin:10px 0"></select>`;
c.innerHTML=`<div class="chart-card"><h2>Промышленное производство по регионам, % к соотв. месяцу прошлогоднему</h2>
<p style="color:#9aa0c0;font-size:13px">Последний месяц: ${lastM.slice(0,7)}</p>${sel}<canvas id="chr"></canvas></div>`;
const selEl=document.getElementById('regsel2');
regions.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;if(r==='Российская Федерация')o.selected=true;selEl.appendChild(o);});
let chart=null;
const draw=()=>{
const reg=selEl.value, d=all.filter(x=>x.region===reg);
const cfg={type:'line',data:{labels:d.map(x=>x.month.slice(0,7)),datasets:[
{label:'% г/г',data:d.map(x=>x.yoy),borderColor:'#ffb74d',tension:0.3,pointRadius:0}]},
options:{plugins:{legend:{labels:{color:'#e0e0e0'}}},scales:{x:{ticks:{color:'#9aa0c0',maxTicksLimit:12}}}}};
if(chart)chart.destroy();
chart=new Chart(document.getElementById('chr'),cfg);
};
selEl.addEventListener('change',draw);
draw();
}

else if(key==='fns'){
const defs=[
['fns_rev_profit','Прибыль организаций','#4fc3f7'],
['fns_exp_sales_profit','Расходы организаций','#ef5350'],
['fns_nds_accrued_total','НДС начисленный','#81c784'],
['fns_ndfl_withheld','НДФЛ удержанный','#ffb74d'],
['fns_usn_income','УСН: доходы','#ce93d8'],
['fns_usn_expense','УСН: расходы','#4dd0e1'],
['fns_tnpayers','Налогоплательщики','#9ccc65'],
];
const avail=defs.filter(x=>D[x[0]]);
const latest={};
avail.forEach(x=>{const s=D[x[0]].data;latest[x[0]]=s[s.length-1];});
c.innerHTML=avail.map((x,i)=>`<div class="chart-card"><h2>${x[1]} (ФНС, млрд руб./год)</h2>
<p style="color:#9aa0c0;font-size:12px">${latest[x[0]][0]}: ${latest[x[0]][1].toLocaleString('ru-RU')}</p>
<canvas id="fns${i}"></canvas></div>`).join('');
avail.forEach((x,i)=>{
const s=D[x[0]].data;
new Chart(document.getElementById('fns'+i),{type:'line',data:{labels:s.map(p=>p[0]),
datasets:[{label:x[1],data:s.map(p=>p[1]),borderColor:x[2],backgroundColor:x[2]+'22',fill:true,tension:.3,pointRadius:2}]},
options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>(v/1000).toFixed(1)+' трлн'}}}}});
});
}

else if(key==='ws_infl'){
const d=D.wordstat_infl_attention_macro||[];
if(!d.length){c.innerHTML='<p style="color:#ffb74d;padding:16px">Нет данных</p>';return;}
const regs=[...new Set(d.flatMap(x=>Object.keys(x).filter(k=>k!=='date')))];
const colors=['#4fc3f7','#81c784','#ffb74d','#ef5350','#ce93d8','#4dd0e1','#9ccc65','#ff8a65','#ba68c8'];
const labels=d.map(x=>x.date.slice(0,7));
c.innerHTML=`<div class="chart-card"><h2>Внимание к инфляции по макрорегионам (Wordstat, запросов на 100 тыс.)</h2>
<p style="color:#9aa0c0;font-size:12px">Фразы «инфляция», «рост цен», «подорожание» · виден пик марта 2022</p>
<canvas id="ch"></canvas></div>`;
new Chart(document.getElementById('ch'),{type:'line',data:{labels,
datasets:regs.map((r,i)=>({label:r,data:d.map(x=>x[r]??null),borderColor:colors[i%9],tension:.3,pointRadius:0,borderWidth:i===0?2:1.2}))},
options:{plugins:{legend:{labels:{boxWidth:10,font:{size:9},color:'#e0e0e0'}}},scales:{x:{ticks:{maxTicksLimit:10,color:'#9aa0c0'}}},interaction:{mode:'index',intersect:false}}});
}

else if(key==='ws_infl_reg'){
const s=D.wordstat_infl_attention_subjects||{};
const all=s.data||[], keyRegs=s.regions||[];
if(!all.length){c.innerHTML='<p style="color:#ffb74d;padding:16px">Нет данных</p>';return;}
const labels=all.map(x=>x.date.slice(0,7));
// selector with all subjects
const regs=Object.keys(all[0]).filter(k=>k!=='date');
const sel=`<select id="subjsel" style="width:100%;max-width:320px;padding:10px;font-size:15px;background:#16213e;color:#e0e0e0;border:1px solid #30365e;border-radius:8px;margin:10px 0"></select>`;
// stats: latest spread
const last=all[all.length-1];
const vals=regs.map(r=>last[r]).filter(v=>v!=null);
const mn=Math.min(...vals),mx=Math.max(...vals);
c.innerHTML=`<div class="chart-card"><h2>Внимание к инфляции: субъекты РФ (запросов на 100 тыс.)</h2>
<div class="stats">
<div class="stat"><div class="val">${mx.toFixed(0)}</div><div class="label">Максимум (посл. мес.)</div></div>
<div class="stat red"><div class="val">${mn.toFixed(0)}</div><div class="label">Минимум</div></div>
</div>
<p style="color:#9aa0c0;font-size:12px">${regs.length} гео-единиц · фраза «инфляция» · 2018-01…2026-07</p>
${sel}<canvas id="chs"></canvas></div>`;
const selEl=document.getElementById('subjsel');
regs.forEach((r,i)=>{const o=document.createElement('option');o.value=r;o.textContent=r;if(keyRegs.includes(r))o.selected=false;selEl.appendChild(o);});
selEl.value='Москва и область' in last ? 'Москва и область':regs[0];
let chart=null;
const draw=()=>{
const reg=selEl.value;
const cfg={type:'line',data:{labels,datasets:[
{label:reg,data:all.map(x=>x[reg]??null),borderColor:'#4fc3f7',backgroundColor:'#4fc3f722',fill:true,tension:.3,pointRadius:0},
{label:'Медиана по РФ',data:all.map(x=>{const v=regs.map(r=>x[r]).filter(v=>v!=null).sort((a,b)=>a-b);return v.length?v[Math.floor(v.length/2)]:null}),borderColor:'#ef5350',borderDash:[4,3],tension:.3,pointRadius:0}]},
options:{plugins:{legend:{labels:{boxWidth:10,color:'#e0e0e0'}}},scales:{x:{ticks:{maxTicksLimit:10,color:'#9aa0c0'}}},interaction:{mode:'index',intersect:false}}};
if(chart)chart.destroy();
chart=new Chart(document.getElementById('chs'),cfg);};
selEl.addEventListener('change',draw);
draw();
}

else if(key==='ws_housing'){
const d=D.wordstat_housing_attention||[];
if(!d.length){c.innerHTML='<p style="color:#ffb74d;padding:16px">Нет данных</p>';return;}
const regs=[...new Set(d.flatMap(x=>Object.keys(x).filter(k=>k!=='date')))];
const colors=['#4fc3f7','#81c784','#ffb74d','#ef5350','#ce93d8','#4dd0e1','#9ccc65','#ff8a65','#ba68c8'];
const labels=d.map(x=>x.date.slice(0,7));
c.innerHTML=`<div class="chart-card"><h2>Внимание к ценам на жильё по макрорегионам (запросов на 100 тыс.)</h2>
<p style="color:#9aa0c0;font-size:12px">Фразы «цены на квартиры», «стоит ли покупать квартиру»</p>
<canvas id="chh"></canvas></div>`;
new Chart(document.getElementById('chh'),{type:'line',data:{labels,datasets:regs.map((r,i)=>({label:r,data:d.map(x=>x[r]??null),borderColor:colors[i%9],tension:.3,pointRadius:0,borderWidth:1.2}))},
options:{plugins:{legend:{labels:{boxWidth:10,font:{size:9},color:'#e0e0e0'}}},scales:{x:{ticks:{maxTicksLimit:10,color:'#9aa0c0'}}},interaction:{mode:'index',intersect:false}}});
}
}

// Load data
fetch('data-summary.json').then(r=>r.json()).then(d=>{
DATA=d;
initTabs();
document.querySelector('.tab').click();
}).catch(e=>{
document.getElementById('content').innerHTML='<p style="color:#ef5350;padding:20px">Ошибка загрузки данных: '+e.message+'</p>';
});
</script>
</body>
</html>

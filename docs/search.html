<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Поиск | Research Wiki</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e0e0e0;padding:12px;max-width:900px;margin:0 auto}
h1{font-size:1.3rem;margin-bottom:8px;background:linear-gradient(90deg,#4fc3f7,#81c784);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#888;font-size:0.8rem;margin-bottom:12px}
.search-box{position:sticky;top:0;background:#0f1117;padding:8px 0;z-index:10}
input[type=text]{width:100%;padding:12px 16px;font-size:16px;background:#1a1d29;border:1px solid #2a2d3a;border-radius:8px;color:#e0e0e0;outline:none}
input[type=text]:focus{border-color:#4fc3f7}
input[type=text]::placeholder{color:#555}
.filters{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.filter{padding:4px 10px;font-size:0.75rem;background:#1a1d29;border:1px solid #2a2d3a;border-radius:20px;cursor:pointer;user-select:none}
.filter.active{background:#2a3a4a;border-color:#4fc3f7;color:#4fc3f7}
.filter.badge{margin-left:auto;color:#666}
.results{margin-top:12px}
.result{background:#1a1d29;border:1px solid #2a2d3a;border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.result:active{border-color:#4fc3f7}
.result h3{font-size:0.9rem;color:#4fc3f7;margin-bottom:4px;line-height:1.3}
.result .cat{font-size:0.65rem;color:#666;text-transform:uppercase;display:inline-block;margin-left:6px}
.result p{font-size:0.8rem;color:#999;line-height:1.4}
.result .tags{margin-top:4px}
.tag{display:inline-block;font-size:0.65rem;background:#222531;color:#81c784;padding:1px 6px;border-radius:8px;margin-right:3px}
.highlight{background:#2a3a4a;color:#4fc3f7;padding:0 2px;border-radius:2px}
.no-results{text-align:center;color:#555;padding:40px 20px;font-size:0.9rem}
.stats{font-size:0.7rem;color:#555;margin-top:4px}
a{color:#4fc3f7;text-decoration:none}
.back{font-size:0.8rem;margin-bottom:10px;display:inline-block}
</style>
</head>
<body>

<a href="index.html" class="back">← Главная</a>
<h1>🔍 Поиск по research-wiki</h1>
<p class="subtitle">556 файлов · papers · ru_papers · queries · bibliography</p>

<div class="search-box">
<input type="text" id="q" placeholder="Поиск: автор, название, тема, ключевое слово…" autocomplete="off">
<div class="filters">
<div class="filter active" data-cat="all">Все</div>
<div class="filter" data-cat="paper">English papers</div>
<div class="filter" data-cat="ru_paper">Русские</div>
<div class="filter" data-cat="query">Queries</div>
<div class="filter" data-cat="bibliography">Библиография</div>
<div class="filter badge" id="count">0</div>
</div>
</div>

<div class="results" id="results"></div>

<script>
let DATA=[];let activeCat='all';

// Load index
fetch('search-index.json').then(r=>r.json()).then(d=>{
DATA=d;
document.getElementById('count').textContent=DATA.length+' файлов';
search();
}).catch(e=>{
document.getElementById('results').innerHTML='<p class="no-results">Ошибка загрузки индекса. Откройте через GitHub Pages.</p>';
});

// Search function
function search(){
const q=document.getElementById('q').value.trim().toLowerCase();
let results=DATA;

// Filter by category
if(activeCat!=='all'){
results=results.filter(d=>d.category===activeCat);
}

// Filter by query
if(q){
const terms=q.split(/\s+/).filter(t=>t.length>0);
results=results.filter(d=>{
const text=((d.title||'')+' '+(d.abstract||'')+' '+(d.tags||[]).join(' ')+' '+d.file).toLowerCase();
return terms.every(t=>text.includes(t));
});
}

// Sort: papers first, then by title
results.sort((a,b)=>{
const catOrder={paper:0,ru_paper:1,query:2,bibliography:3};
return (catOrder[a.category]||9)-(catOrder[b.category]||9)||a.title.localeCompare(b.title);
});

document.getElementById('count').textContent=results.length+' найдено';

// Render
const container=document.getElementById('results');
if(results.length===0){
container.innerHTML='<p class="no-results">Ничего не найдено</p>';
return;
}

container.innerHTML=results.slice(0,100).map(d=>{
let title=d.title||d.file;
let abs=d.abstract||'';
const qterms=q.split(/\s+/).filter(t=>t.length>1);

// Highlight
qterms.forEach(t=>{
const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
title=title.replace(re,'<span class="highlight">$1</span>');
abs=abs.replace(re,'<span class="highlight">$1</span>');
});

const catLabel={paper:'EN',ru_paper:'RU',query:'QUERY',bibliography:'BIB'}[d.category]||'';
const tags=(d.tags||[]).slice(0,4).map(t=>'<span class="tag">'+t+'</span>').join('');
const url=d.url.replace(/ /g,'%20');

return '<div class="result" onclick="window.open(\''+url+'\',\'_blank\')">'+
'<h3>'+title+' <span class="cat">'+catLabel+'</span></h3>'+
(abs?'<p>'+abs+'</p>':'')+
(tags?'<div class="tags">'+tags+'</div>':'')+
'</div>';
}).join('');
}

// Input handler
let debounce;
document.getElementById('q').addEventListener('input',()=>{
clearTimeout(debounce);
debounce=setTimeout(search,200);
});

// Filter handlers
document.querySelectorAll('.filter[data-cat]').forEach(f=>{
f.addEventListener('click',()=>{
document.querySelectorAll('.filter[data-cat]').forEach(x=>x.classList.remove('active'));
f.classList.add('active');
activeCat=f.dataset.cat;
search();
});
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Векторный поиск | Research Wiki</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e0e0e0;padding:12px;max-width:900px;margin:0 auto}
h1{font-size:1.3rem;margin-bottom:8px;background:linear-gradient(90deg,#4fc3f7,#81c784);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#888;font-size:0.8rem;margin-bottom:12px}
.search-box{position:sticky;top:0;background:#0f1117;padding:8px 0;z-index:10}
input[type=text]{width:100%;padding:12px 16px;font-size:16px;background:#1a1d29;border:1px solid #2a2d3a;border-radius:8px;color:#e0e0e0;outline:none}
input[type=text]:focus{border-color:#4fc3f7}
input[type=text]::placeholder{color:#555}
.filters{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.filter{padding:4px 10px;font-size:0.75rem;background:#1a1d29;border:1px solid #2a2d3a;border-radius:20px;cursor:pointer;user-select:none}
.filter.active{background:#2a3a4a;border-color:#4fc3f7;color:#4fc3f7}
.filter.badge{margin-left:auto;color:#666}
.results{margin-top:12px}
.result{background:#1a1d29;border:1px solid #2a2d3a;border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.result:active{border-color:#4fc3f7}
.result h3{font-size:0.9rem;color:#4fc3f7;margin-bottom:4px;line-height:1.3}
.result .cat{font-size:0.65rem;color:#666;text-transform:uppercase;display:inline-block;margin-left:6px}
.result .score{font-size:0.65rem;color:#81c784;float:right}
.result p{font-size:0.8rem;color:#999;line-height:1.4}
.no-results{text-align:center;color:#555;padding:40px 20px;font-size:0.9rem}
.loading{text-align:center;padding:20px;font-size:0.9rem}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid #2a2d3a;border-top-color:#4fc3f7;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-bar{height:3px;background:#1a1d29;border-radius:2px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4fc3f7,#81c784);transition:width .3s}
a{color:#4fc3f7;text-decoration:none}
.back{font-size:0.8rem;margin-bottom:10px;display:inline-block}
/* Detail modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#161927;border:1px solid #2a2d3a;border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:18px 16px 28px;animation:slideup .22s ease-out}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(min-width:700px){.modal-overlay.open{align-items:center}.modal{border-radius:16px;padding:24px}}
.modal .m-close{position:sticky;top:0;float:right;background:#1a1d29;border:1px solid #2a2d3a;color:#888;width:32px;height:32px;border-radius:50%;font-size:1rem;cursor:pointer;line-height:1}
.modal h2{font-size:1.05rem;color:#4fc3f7;margin:6px 0 8px;line-height:1.35;padding-right:36px}
.modal .meta{font-size:0.78rem;color:#888;margin-bottom:10px;line-height:1.5}
.modal .meta b{color:#b0bec5;font-weight:600}
.modal .sect{margin:12px 0}
.modal .sect h4{font-size:0.72rem;text-transform:uppercase;letter-spacing:.5px;color:#81c784;margin-bottom:6px}
.modal .sect p{font-size:0.82rem;color:#b0bec5;line-height:1.55}
.modal .chips{display:flex;flex-wrap:wrap;gap:5px}
.modal .chip{font-size:0.7rem;background:#1e2938;border:1px solid #2a3a4a;color:#9fc3e8;border-radius:12px;padding:3px 9px}
.modal .chip.gray{color:#888;background:#1a1d29;border-color:#2a2d3a}
.modal a.chip{cursor:pointer}
.modal .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.modal .btn{flex:1;min-width:140px;text-align:center;padding:10px 14px;border-radius:10px;font-size:0.85rem;border:1px solid #2a3a4a;cursor:pointer;background:#1a1d29;color:#e0e0e0}
.modal .btn.primary{background:#1a3a4a;border-color:#4fc3f7;color:#4fc3f7;font-weight:600}
</style>
</head>
<body>

<a href="index.html" class="back">← Главная</a>
<h1>🧠 Векторный поиск</h1>
<p class="subtitle" id="status">Загрузка…</p>

<div class="search-box" style="display:none" id="search-box">
<input type="text" id="q" placeholder="Семантический поиск: тема, концепция, метод…" autocomplete="off" disabled>
<div class="filters">
<div class="filter active" data-cat="all">Все</div>
<div class="filter" data-cat="paper">EN</div>
<div class="filter" data-cat="ru_paper">RU</div>
<div class="filter" data-cat="query">Queries</div>
<div class="filter" data-cat="bib">📚 Библиография</div>
<div class="filter badge" id="count">0</div>
</div>
</div>

<div id="progress" style="display:none" class="loading">
<div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
<div id="prog-text">Загрузка модели…</div>
</div>

<div class="results" id="results"></div>

<!-- Detail modal -->
<div class="modal-overlay" id="modal-overlay">
<div class="modal" id="modal"></div>
</div>

<script type="module">
import {pipeline,env} from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

// Configure: load model from HF Hub, cache in browser
env.allowLocalModels=false;

let extractor=null;
let EMB=null;let META=[];let DIM=384;
let activeCat='all';let loaded=false;
let lastQuery='';let searchTimer=null;
let BIB=null; // bibliography entries

// Load model + embeddings in parallel
async function init(){
const status=document.getElementById('status');
const prog=document.getElementById('progress');
const progText=document.getElementById('prog-text');
const progFill=document.getElementById('prog-fill');

try{
// Step 1: Load embeddings (1.3 MB)
progText.textContent='Загрузка индекса (1.3 МБ)…';
progFill.style.width='10%';

const r=await fetch('embeddings-f32.json');
const data=await r.json();
DIM=data.dim;META=data.meta;

// Decode base64 → Float32Array
const bin=atob(data.embeddings_b64);
const buf=new ArrayBuffer(bin.length);
const u8=new Uint8Array(buf);
for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
EMB=new Float32Array(buf);

progFill.style.width='40%';
progText.textContent='Загрузка модели (17 МБ, кешируется)…';

// Step 2: Load ONNX model via transformers.js
// First load downloads ~23MB, subsequent loads use browser cache
extractor=await pipeline('feature-extraction',
'Xenova/paraphrase-MiniLM-L3-v2',
{quantized:true});

progFill.style.width='100%';
prog.style.display='none';
status.textContent=META.length+' документов · модель готова';
document.getElementById('search-box').style.display='block';
document.getElementById('q').disabled=false;
document.getElementById('q').focus();

loaded=true;
search();
}catch(e){
progText.textContent='Ошибка: '+e.message;
console.error(e);
}
}

// Embed query text using transformers.js
async function embedQuery(text){
const output=await extractor(text,{pooling:'mean',normalize:true});
return output.data; // Float32Array(384)
}

// Cosine similarity search
async function doSearch(query){
if(!loaded||!query.trim())return[];

// Encode query
const qVec=await embedQuery(query);

// Compute cosine similarity (embeddings already normalized)
const scores=new Float32Array(META.length);
for(let i=0;i<META.length;i++){
let dot=0;
const off=i*DIM;
for(let j=0;j<DIM;j++){
dot+=EMB[off+j]*qVec[j];
}
scores[i]=dot;
}

// Sort
const idx=Array.from({length:META.length},(_,i)=>i);
idx.sort((a,b)=>scores[b]-scores[a]);

// Filter + top results
let results=idx;
if(activeCat!=='all'){
results=idx.filter(i=>META[i].c===activeCat);
}

return results.slice(0,50).map(i=>({
meta:META[i],score:scores[i]
}));
}

async function search(){
if(!loaded)return;
const q=document.getElementById('q').value.trim().toLowerCase();

// Bibliography mode — no vector search needed
if(activeCat==='bib'){
renderBib(q);
return;
}

if(q===lastQuery)return;
lastQuery=q;

const container=document.getElementById('results');
if(!q){
container.innerHTML='';
document.getElementById('count').textContent='0';
return;
}

container.innerHTML='<div class="loading"><span class="spinner"></span>Поиск…</div>';

try{
const results=await doSearch(q);
document.getElementById('count').textContent=results.length+' найдено';

if(results.length===0){
container.innerHTML='<p class="no-results">Ничего не найдено</p>';
return;
}

container.innerHTML=results.map(r=>{
const m=r.meta;
const catLabel={paper:'EN',ru_paper:'RU',query:'QUERY',bibliography:'BIB'}[m.c]||'';
// Build viewer URL: viewer.html?p=papers/file.md
const filePath=m.u.replace('https://github.com/LnrGitG/research-wiki/blob/main/','');
const viewerUrl='viewer.html?p='+encodeURIComponent(filePath);
const scorePct=(r.score*100).toFixed(0)+'%';
const title=escapeHtml(m.t||m.f);
const abs=m.a?escapeHtml(m.a):'';
return '<div class="result" onclick="openDetail(\''+encodeURIComponent(filePath)+'\',\''+viewerUrl.replace(/'/g,'')+'\',\''+encodeURIComponent(title)+'\')">'+
'<h3>'+title+' <span class="cat">'+catLabel+'</span>'+
'<span class="score">'+scorePct+'</span></h3>'+
(abs?'<p>'+abs+'</p>':'')+
'</div>';
}).join('');
}catch(e){
container.innerHTML='<p class="no-results">Ошибка: '+e.message+'</p>';
}
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ---- Detail modal (paper-details.json) ----
let DETAILS=null;
const MODEL_RU={ 'hedonic':'гедонистические модели','repeat-sales':'метод повторных продаж','supply-elasticity':'оценка эластичности предложения','panel':'панельные данные','IV':'инструментальные переменные','DiD':'разность разностей (DiD)','RDD':'регрессия на разрывах (RDD)','VAR/FAVAR':'VAR/FAVAR модели','MIDAS':'MIDAS','DSGE':'DSGE','ARDL':'ARDL','PCA':'главные компоненты (PCA)','machine-learning':'машинное обучение','simulation':'калибровка / симуляции','event-study':'event study','GARCH':'GARCH','spatial-econometrics':'пространственная эконометрика','Bayesian':'байесовские методы','timeseries-filters':'фильтры временных рядов (HP/Калман)','structural-model':'структурные модели' };
const DATA_RU={ 'Rosstat':'Росстат','CBR':'Банк России','ЕИСЖС':'ЕИСЖС (наш.дом.рф)','ДОМ.РФ':'ДОМ.РФ','Rosreestr':'Росреестр','ACS/перепись':'American Community Survey','census':'переписи населения','FHFA':'FHFA','Zillow':'Zillow','CoreLogic':'CoreLogic','LiBO':'кредитные истории (БКИ)','SPARK':'СПАРК','ЕМИСС':'ЕМИСС','NOSTROY':'НОСТРОЙ','GDELT':'GDELT','Wordstat':'Яндекс Wordstat','Google Trends':'Google Trends','admin-data':'административные данные','survey-data':'опросные данные','geospatial':'гео-данные (GIS/спутники)' };

async function openDetail(filePathEnc, viewerUrl, titleEnc){
const filePath=decodeURIComponent(filePathEnc);
const overlay=document.getElementById('modal-overlay');
const modal=document.getElementById('modal');
overlay.classList.add('open');
modal.innerHTML='<div class="loading"><span class="spinner"></span>Загрузка…</div>';
if(!DETAILS){
try{const r=await fetch('paper-details.json');DETAILS=await r.json();}
catch(e){modal.innerHTML='<button class="m-close" onclick="closeDetail()">✕</button><p class="no-results">Не удалось загрузить детали</p>';return;}
}
const d=DETAILS[filePath]||{};
const title=decodeURIComponent(titleEnc)||d.t||filePath;
const authors=(d.authors&&d.authors.length)?d.authors.join(', '):'';
let metaHtml='';
if(authors)metaHtml+='<b>'+escapeHtml(authors)+'</b>';
if(d.year)metaHtml+=(metaHtml?' · ':'')+'<b>'+escapeHtml(d.year)+'</b>';
if(d.venue)metaHtml+=(metaHtml?' · ':'')+escapeHtml(d.venue);
if(d.type)metaHtml+=(metaHtml?' · ':'')+'<span style="color:#666">'+escapeHtml(d.type)+'</span>';
const chips=(arr,rus)=>arr&&arr.length?'<div class="chips">'+arr.map(x=>'<span class="chip">'+escapeHtml((rus&&rus[x])||x)+'</span>').join('')+'</div>':'';
modal.innerHTML=
'<button class="m-close" onclick="closeDetail()">✕</button>'+
'<h2>'+escapeHtml(title)+'</h2>'+
(metaHtml?'<div class="meta">'+metaHtml+'</div>':'')+
(d.abstract?'<div class="sect"><h4>Аннотация</h4><p>'+escapeHtml(d.abstract)+'</p></div>':'')+
((d.models&&d.models.length)?'<div class="sect"><h4>Модели и методы</h4>'+chips(d.models,MODEL_RU)+'</div>':'')+
((d.data&&d.data.length)?'<div class="sect"><h4>Данные и источники</h4>'+chips(d.data,DATA_RU)+'</div>':'')+
((d.tags&&d.tags.length)?'<div class="sect"><h4>Темы</h4>'+chips(d.tags.map(t=>t.replace(/-/g,' ')))+'</div>':'')+
'<div class="actions">'+
'<a class="btn primary" href="'+viewerUrl+'">📖 Открыть статью</a>'+
(d.url?'<a class="btn" href="'+escapeHtml(d.url)+'" target="_blank" rel="noopener">🔗 Первоисточник</a>':'')+
'</div>';
}
function closeDetail(){document.getElementById('modal-overlay').classList.remove('open');}
// expose for inline onclick handlers (module scope is not global)
window.openDetail=openDetail;window.closeDetail=closeDetail;

// ---- Bibliography detail modal ----
window.openBibDetail=function(text){
// find entry in cached BIB by exact text
const e=(BIB||[]).find(b=>b.text===text);
if(!e)return;
const overlay=document.getElementById('modal-overlay');
const modal=document.getElementById('modal');
overlay.classList.add('open');
const author=e.author?escapeHtml(e.author):'';
let metaHtml='';
if(author)metaHtml+='<b>'+author+'</b>';
if(e.year)metaHtml+=(metaHtml?' · ':'')+'<b>'+escapeHtml(e.year)+'</b>';
if(e.lang)metaHtml+=(metaHtml?' · ':'')+'<span style="color:#666">'+(e.lang==='ru'?'рускоязычный источник':'англоязычный источник')+'</span>';
// full citation text (strip html markers)
const fullText=escapeHtml(e.text.replace(/<\/?u>/g,'').replace(/\([^)]*иссл\.\)/g,'').trim());
let citesHtml='';
if(e.cites&&e.cites.length){
citesHtml='<div class="sect"><h4>Цитируется в исследованиях wiki</h4>'+
'<div class="chips">'+e.cites.map((p,i)=>{
const t=(e.cite_titles&&e.cite_titles[i])||p;
const viewerUrl='viewer.html?p='+encodeURIComponent(p);
return '<a class="chip" style="text-decoration:none" href="'+viewerUrl+'">'+escapeHtml(t.length>45?t.slice(0,45)+'…':t)+'</a>';
}).join('')+'</div></div>';
}
let doiHtml='';
if(e.doi){
doiHtml='<div class="sect"><h4>DOI</h4><p><a href="https://doi.org/'+escapeHtml(e.doi)+'" target="_blank" rel="noopener">'+escapeHtml(e.doi)+'</a></p></div>';
}else{doiHtml='';}
modal.innerHTML=
'<button class="m-close" onclick="closeDetail()">✕</button>'+
'<h2>Библиографическая запись</h2>'+
(metaHtml?'<div class="meta">'+metaHtml+'</div>':'')+
'<div class="sect"><h4>Полная ссылка</h4><p style="font-style:italic">'+fullText+'</p></div>'+
doiHtml+
citesHtml+
'<div class="actions">'+
(e.doi?'<a class="btn primary" href="https://doi.org/'+escapeHtml(e.doi)+'" target="_blank" rel="noopener">🔗 Открыть по DOI</a>':'')+
'<button class="btn" onclick="closeDetail()">Закрыть</button>'+
'</div>';
};
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeDetail();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});

// Render bibliography list (filterable, no vector search)
async function renderBib(query){
const container=document.getElementById('results');
document.getElementById('count').textContent='';

// Load bibliography JSON on first access
if(!BIB){
try{
const r=await fetch('bibliography.json');
BIB=await r.json();
}catch(e){
container.innerHTML='<p class="no-results">Ошибка загрузки библиографии</p>';
return;
}
}

let entries=BIB;

// Filter by query text
if(query){
entries=BIB.filter(e=>{
return e.text.toLowerCase().includes(query)||
e.author.toLowerCase().includes(query)||
e.year.includes(query);
});
}

document.getElementById('count').textContent=entries.length+' из '+BIB.length;

if(entries.length===0){
container.innerHTML='<p class="no-results">Ничего не найдено в библиографии</p>';
return;
}

// Render entries (max 500 for performance)
const show=entries.slice(0,500);
let html='<div style="color:#666;font-size:0.75rem;margin-bottom:8px">'+
(entries.length>500?'Показано 500 из '+entries.length+'. Уточните запрос.':'')+
'</div>';

html+=show.map(e=>{
const author=escapeHtml(e.author||'');
const year=e.year?`<span style="color:#81c784">(${e.year})</span>`:'';
const lang=e.lang==='ru'?'<span style="color:#ffb74d;font-size:0.7rem">RU</span>':'';
const text=escapeHtml(e.text.length>200?e.text.slice(0,200)+'…':e.text);
return `<div class="result" style="cursor:default" onclick="openBibDetail(${JSON.stringify(e.text).replace(/"/g,'&quot;')})">
<h3 style="font-size:0.82rem">${author} ${year} ${lang}</h3>
<p style="font-size:0.78rem;color:#999">${text}</p>
</div>`;
}).join('');

container.innerHTML=html;
}

// Input handler with debounce
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('q').addEventListener('input',()=>{
clearTimeout(searchTimer);
searchTimer=setTimeout(search,400);
});
// Filter buttons
document.querySelectorAll('.filter[data-cat]').forEach(f=>{
f.addEventListener('click',()=>{
document.querySelectorAll('.filter[data-cat]').forEach(x=>x.classList.remove('active'));
f.classList.add('active');
activeCat=f.dataset.cat;
// For bibliography: clear query state and render immediately
if(activeCat==='bib'){
lastQuery='\x01'; // force re-search
document.getElementById('q').value=document.getElementById('q').value;
document.getElementById('q').placeholder='Фильтр по автору, году, теме…';
search();
}else{
document.getElementById('q').placeholder='Семантический поиск: тема, концепция, метод…';
lastQuery='';
search();
}
});
});
// Start loading
init();
});
</script>
</body>
</html>

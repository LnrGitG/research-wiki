<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Векторный поиск | Research Wiki</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e0e0e0;padding:12px;max-width:900px;margin:0 auto}
h1{font-size:1.3rem;margin-bottom:8px;background:linear-gradient(90deg,#4fc3f7,#81c784);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#888;font-size:0.8rem;margin-bottom:12px}
.search-box{position:sticky;top:0;background:#0f1117;padding:8px 0;z-index:10}
input[type=text]{width:100%;padding:12px 16px;font-size:16px;background:#1a1d29;border:1px solid #2a2d3a;border-radius:8px;color:#e0e0e0;outline:none}
input[type=text]:focus{border-color:#4fc3f7}
input[type=text]::placeholder{color:#555}
.filters{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.filter{padding:4px 10px;font-size:0.75rem;background:#1a1d29;border:1px solid #2a2d3a;border-radius:20px;cursor:pointer;user-select:none}
.filter.active{background:#2a3a4a;border-color:#4fc3f7;color:#4fc3f7}
.filter.badge{margin-left:auto;color:#666}
.results{margin-top:12px}
.result{background:#1a1d29;border:1px solid #2a2d3a;border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.result:active{border-color:#4fc3f7}
.result h3{font-size:0.9rem;color:#4fc3f7;margin-bottom:4px;line-height:1.3}
.result .cat{font-size:0.65rem;color:#666;text-transform:uppercase;display:inline-block;margin-left:6px}
.result .score{font-size:0.65rem;color:#81c784;float:right}
.result p{font-size:0.8rem;color:#999;line-height:1.4}
.no-results{text-align:center;color:#555;padding:40px 20px;font-size:0.9rem}
.loading{text-align:center;padding:20px;font-size:0.9rem}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid #2a2d3a;border-top-color:#4fc3f7;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-bar{height:3px;background:#1a1d29;border-radius:2px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4fc3f7,#81c784);transition:width .3s}
a{color:#4fc3f7;text-decoration:none}
.back{font-size:0.8rem;margin-bottom:10px;display:inline-block}
</style>
</head>
<body>

<a href="index.html" class="back">← Главная</a>
<h1>🧠 Векторный поиск</h1>
<p class="subtitle" id="status">Загрузка…</p>

<div class="search-box" style="display:none" id="search-box">
<input type="text" id="q" placeholder="Семантический поиск: тема, концепция, метод…" autocomplete="off" disabled>
<div class="filters">
<div class="filter active" data-cat="all">Все</div>
<div class="filter" data-cat="paper">EN</div>
<div class="filter" data-cat="ru_paper">RU</div>
<div class="filter" data-cat="query">Queries</div>
<div class="filter badge" id="count">0</div>
</div>
</div>

<div id="progress" style="display:none" class="loading">
<div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
<div id="prog-text">Загрузка модели…</div>
</div>

<div class="results" id="results"></div>

<script type="module">
import {pipeline,env} from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

// Configure: load model from HF Hub, cache in browser
env.allowLocalModels=false;

let extractor=null;
let EMB=null;let META=[];let DIM=384;
let activeCat='all';let loaded=false;
let lastQuery='';let searchTimer=null;

// Load model + embeddings in parallel
async function init(){
const status=document.getElementById('status');
const prog=document.getElementById('progress');
const progText=document.getElementById('prog-text');
const progFill=document.getElementById('prog-fill');

try{
// Step 1: Load embeddings (1.3 MB)
progText.textContent='Загрузка индекса (1.3 МБ)…';
progFill.style.width='10%';

const r=await fetch('embeddings-f32.json');
const data=await r.json();
DIM=data.dim;META=data.meta;

// Decode base64 → Float32Array
const bin=atob(data.embeddings_b64);
const buf=new ArrayBuffer(bin.length);
const u8=new Uint8Array(buf);
for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
EMB=new Float32Array(buf);

progFill.style.width='40%';
progText.textContent='Загрузка модели (23 МБ, кешируется)…';

// Step 2: Load ONNX model via transformers.js
// First load downloads ~23MB, subsequent loads use browser cache
extractor=await pipeline('feature-extraction',
'Xenova/paraphrase-multilingual-MiniLM-L12-v2',
{quantized:true});

progFill.style.width='100%';
prog.style.display='none';
status.textContent=META.length+' документов · модель готова';
document.getElementById('search-box').style.display='block';
document.getElementById('q').disabled=false;
document.getElementById('q').focus();

loaded=true;
search();
}catch(e){
progText.textContent='Ошибка: '+e.message;
console.error(e);
}
}

// Embed query text using transformers.js
async function embedQuery(text){
const output=await extractor(text,{pooling:'mean',normalize:true});
return output.data; // Float32Array(384)
}

// Cosine similarity search
async function doSearch(query){
if(!loaded||!query.trim())return[];

// Encode query
const qVec=await embedQuery(query);

// Compute cosine similarity (embeddings already normalized)
const scores=new Float32Array(META.length);
for(let i=0;i<META.length;i++){
let dot=0;
const off=i*DIM;
for(let j=0;j<DIM;j++){
dot+=EMB[off+j]*qVec[j];
}
scores[i]=dot;
}

// Sort
const idx=Array.from({length:META.length},(_,i)=>i);
idx.sort((a,b)=>scores[b]-scores[a]);

// Filter + top results
let results=idx;
if(activeCat!=='all'){
results=idx.filter(i=>META[i].c===activeCat);
}

return results.slice(0,50).map(i=>({
meta:META[i],score:scores[i]
}));
}

async function search(){
if(!loaded)return;
const q=document.getElementById('q').value.trim();
if(q===lastQuery)return;
lastQuery=q;

const container=document.getElementById('results');
if(!q){
container.innerHTML='';
document.getElementById('count').textContent='0';
return;
}

container.innerHTML='<div class="loading"><span class="spinner"></span>Поиск…</div>';

try{
const results=await doSearch(q);
document.getElementById('count').textContent=results.length+' найдено';

if(results.length===0){
container.innerHTML='<p class="no-results">Ничего не найдено</p>';
return;
}

container.innerHTML=results.map(r=>{
const m=r.meta;
const catLabel={paper:'EN',ru_paper:'RU',query:'QUERY',bibliography:'BIB'}[m.c]||'';
const url=encodeURI(m.u);
const scorePct=(r.score*100).toFixed(0)+'%';
const title=escapeHtml(m.t||m.f);
const abs=m.a?escapeHtml(m.a):'';
return '<div class="result" onclick="window.open(\''+url+'\',\'_blank\')">'+
'<h3>'+title+' <span class="cat">'+catLabel+'</span>'+
'<span class="score">'+scorePct+'</span></h3>'+
(abs?'<p>'+abs+'</p>':'')+
'</div>';
}).join('');
}catch(e){
container.innerHTML='<p class="no-results">Ошибка: '+e.message+'</p>';
}
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Input handler with debounce
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('q').addEventListener('input',()=>{
clearTimeout(searchTimer);
searchTimer=setTimeout(search,400);
});
// Filter buttons
document.querySelectorAll('.filter[data-cat]').forEach(f=>{
f.addEventListener('click',()=>{
document.querySelectorAll('.filter[data-cat]').forEach(x=>x.classList.remove('active'));
f.classList.add('active');
activeCat=f.dataset.cat;
search();
});
});
// Start loading
init();
});
</script>
</body>
</html>

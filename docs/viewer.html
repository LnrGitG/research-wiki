<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Просмотр | Research Wiki</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#c8d0e0;padding:12px;max-width:850px;margin:0 auto;line-height:1.6;font-size:16px}
.back{display:inline-block;margin-bottom:12px;color:#4fc3f7;font-size:0.85rem;text-decoration:none}
.back:active{color:#81c784}
#content{background:#1a1d29;border:1px solid #2a2d3a;border-radius:8px;padding:16px 20px;min-height:200px}
#content h1{color:#4fc3f7;font-size:1.3rem;margin:16px 0 8px}
#content h2{color:#81c784;font-size:1.1rem;margin:14px 0 6px}
#content h3{color:#ffb74d;font-size:1rem;margin:12px 0 4px}
#content h4{color:#ce93d8;font-size:0.9rem;margin:10px 0 4px}
#content p{margin:6px 0;color:#b0bec5}
#content ul,#content ol{margin:6px 0 6px 20px;color:#b0bec5}
#content li{margin:3px 0}
#content a{color:#4fc3f7;text-decoration:none;border-bottom:1px solid #2a3a4a}
#content a:active{color:#81c784}
#content code{background:#111520;padding:1px 4px;border-radius:3px;font-size:0.85em;color:#81c784;font-family:monospace}
#content pre{background:#111520;border:1px solid #2a2d3a;border-radius:6px;padding:10px;overflow-x:auto;margin:8px 0}
#content pre code{background:none;padding:0;color:#c8d0e0}
#content table{border-collapse:collapse;width:100%;margin:8px 0;font-size:0.85rem}
#content th{background:#222531;color:#4fc3f7;padding:6px 8px;text-align:left;border-bottom:2px solid #2a3a4a}
#content td{padding:5px 8px;border-bottom:1px solid #222531;color:#b0bec5}
#content blockquote{border-left:3px solid #4fc3f7;margin:8px 0;padding:4px 12px;color:#888;background:#111520;border-radius:0 4px 4px 0}
#content img{max-width:100%;border-radius:4px}
#content hr{border:none;border-top:1px solid #2a2d3a;margin:16px 0}
#content strong{color:#e0e0e0;font-weight:600}
#content em{color:#90caf9}
.loading{text-align:center;color:#4fc3f7;padding:40px 20px;font-size:0.9rem}
.error{text-align:center;color:#ef5350;padding:40px 20px;font-size:0.9rem}
.meta{font-size:0.75rem;color:#555;margin-bottom:8px;padding:4px 8px;background:#111520;border-radius:4px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.meta a{color:#4fc3f7;text-decoration:none}
</style>
</head>
<body>

<a href="vector-search.html" class="back">← К поиску</a>
<div class="meta" id="meta" style="display:none"></div>
<div id="content"><div class="loading">Загрузка…</div></div>

<script>
// Get file path from URL: viewer.html?p=papers/file.md
const params=new URLSearchParams(location.search);
let path=params.get('p')||'';

// Sanitize: only allow .md files from papers/, queries/
if(!path||!path.endsWith('.md')||path.includes('..')){
document.getElementById('content').innerHTML='<div class="error">Неверный путь файла</div>';
}else{
loadFile(path);
}

async function loadFile(path){
const rawUrl='https://raw.githubusercontent.com/LnrGitG/research-wiki/main/'+path;
const ghUrl='https://github.com/LnrGitG/research-wiki/blob/main/'+path;

try{
const r=await fetch(rawUrl);
if(!r.ok)throw new Error('HTTP '+r.status);
const md=await r.text();

// Render markdown
document.getElementById('content').innerHTML=marked.parse(md);

// Show meta bar
const meta=document.getElementById('meta');
meta.style.display='flex';
meta.innerHTML=
'<span>📄 '+path.split('/').pop()+'</span>'+
'<span><a href="'+ghUrl+'" target="_blank">GitHub ↗</a></span>';

// Set page title
document.title=path.split('/').pop().replace('.md','')+' | Research Wiki';

}catch(e){
document.getElementById('content').innerHTML=
'<div class="error">Не удалось загрузить: '+e.message+'<br><br>'+
'<a href="'+ghUrl+'" style="color:#4fc3f7">Открыть на GitHub ↗</a></div>';
}
}
</script>
</body>
</html>

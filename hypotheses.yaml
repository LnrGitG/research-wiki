  - id: H-011
    kind: hypothesis
    title: "Восстановительный спрос в России догонит приростной к 2050 году"
    status: proposed
    statement: "Доля восстановительного спроса на жилищное строительство в России достигнет доли приростного не позднее 2050 года, а с учётом высокого износа фонда — раньше мирового тренда. Механизм: население РФ сокращается, средний размер домохозяйства падает, поэтому приростной спрос убывает, тогда как накопленный фонд продолжает изнашиваться и требует замены."
    evidence:
      - "Kawasoe 2026 (World Bank WPS11451): глобальный фонд растёт с 2.46-2.48 млрд единиц (2025) до 4.10-4.55 млрд к 2100; спрос смещается от приростного к восстановительному к середине века в большинстве регионов"
      - "Сроки службы фонда в модели Kawasoe: хрупкое 20 лет, среднее 40, устойчивое 60; сокращение срока хрупкого фонда с 20 до 10 лет повышает накопленный восстановительный спрос на 63 процента к 2050"
    next_check: "Построить выбытие жилищного фонда РФ когортной моделью по ярусам качества; сопоставить с вводом жилья Росстата (1-ИЖС, С-1); точка перехода — год, когда расчётный восстановительный спрос превышает приростной. Данные выбытия в РФ практически не наблюдаются — сначала оценить калибровкой сроков службы по косвенным признакам (износ по БТИ, динамика фонда против ввода)"
    sources: [worldbank, rosstat]
    tags: [demography, housing-stock, replacement-demand]
    relates_to: ["papers/kawasoe-2026-housing-requirements-hazard-resilience-2100", "reviews/kawasoe-2026-housing-requirements-hazard-resilience-2100", "reviews/predlozhenie-i-regulirovanie-zhilya"]
    created: 2026-09-19

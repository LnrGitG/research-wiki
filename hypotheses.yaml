  - id: H-RM-2
    kind: hypothesis
    title: "Оборот торговли и зарплаты объясняют часть региональных отклонений СМР"
    status: rejected
    statement: "После поглощения региональных и временных фиксированных эффектов годовой темп СМР по субъекту (03-01, % к соответствующему месяцу) положительно связан с годовым темпом оборота розничной торговли в сопоставимых ценах (05-01) и с приростом реальной начисленной зарплаты (12-01 минус ИПЦ 09-01); совместное включение этих регрессоров снижает RMSE внутрирегионального прогноза не менее чем на 5%."
    test: "Панель 87 субъектов × 2025-01…2026-09, y = yoy СМР; x1 = yoy оборота торговли в сопоставимых ценах; x2 = yoy номинальной зарплаты минус yoy ИПЦ; two-way FE (регион, месяц), SE с кластеризацией по региону; сравнение RMSE на within-трансформации."
    data: "Панель 87×21; источник — региональный монитор Росстата 03-01, 05-01, 12-01, 09-01 (выпуск info-stat-09-2026)"

  - id: H-002
    kind: hypothesis
    title: "Эластичность предложения жилья у финансово ограниченных девелоперов ниже"
    status: active
    statement: "У девелоперов с Net Debt/EBITDA > 4x или Interest Coverage < 2 отклик ввода на рост цен (эластичность) статистически значимо ниже, чем у слабо закредитованных; эффект сильнее в малых и средних девелоперах."
    evidence_for:
      - "Теоретический канал Bernanke-Gertler-Gilchrist (balance sheet channel) — research-ideas-russia-housing §1B"
      - "Долг/EBITDA сектора 481% (cmwp_debt_burden_2026)"
      - "Coven, Golder, Gupta, Ndiaye 2026 (HCEO WP 2026-010, Sep; NBER w35587): OG-модель — финансовое ограничение связывает именно через маржу первоначального взноса (капитализация налога в цены снижает требуемый down-payment, 'embedded leverage'); low property taxes усиливают lock-in пожилых и ограничивают доступ молодых (проверено 2026-09-28, research-radar-2026-09-28)"
      - "Drechsel, Lewis, Melcangi, Pilossoph 2026 (NY Fed LSE, DOI 10.59576/lse.20261007): отклик инвестиций на ДКП распределён, а не средний — ~5% фирм-кварталов дают 4 п.п. падения роста капитала на 1 п.п. ставки, чувствительность транзиторна (вариация внутри фирм доминирует над межфирменной); малые и молодые чувствительнее. Методологический ориентир: тестировать транзиторность чувствительности девелоперов, не только межгрупповую интераксию (проверено 2026-10-08). NBER-версия: w35867, Oct 2026, DOI 10.3386/w35867 (класс A)"
      - "Chapelle & Trannoy 2026 (AMSE WP 2026-26, RePEc:aim:wpaimx:2626, 09.2026): квази-эксперимент по снижению НДС 20%→5,5% во Франции — эластичность предложения жилой площади 0,35, эластичность цены капитала −0,24 (окружение)/−0,42 (ядро), доля переноса ~60% в окружении; жилая площадь фонда +2%. Страновая агрегатная оценка-ориентир для уровня эластичности (диапазон Saiz 2,6→1,3 США, Baum-Snow–Han 0,5–0,74 тракты), но НЕ firm-level conditional на ограничения: прямого конкурента пробелу №1 нет (проверено 2026-10-11, research-radar-2026-10-11)"
      - "Отраслевой фон (проверено 2026-10-13, queries/bankruptcy-construction-2026-10.md): в I полугодии 2026 число корпоративных банкротств выросло на 10,8% (3 547 компаний; Федресурс) — впервые за девять лет; строительство в группе повышенного риска: расчёт «Ведомостей» на данных Федресурса и Росстата даёт превышение среднего по экономике в 2,14 раза (отраслевые доли 25,8% торговля и 25,3% строительство датированы 2025 годом); Контур.Фокус — рост дел в строительстве на 38% за девять месяцев 2026. Индикатор ОТРАСЛЕВОЙ: подрядчиков от застройщиков не отделяет и фирменных финансовых показателей не содержит, поэтому служит фоном для предпосылки о связывающих финансовых ограничениях, а не проверкой firm-level гетерогенности"
      - "Hegarty, Moretti, Ottonello, Perez 2026 (NBER w35918, Oct 2026, DOI 10.3386/w35918): гетерогенная фирменная модель открытой экономики с дефолтным долгом — рост глобальной премии за риск сопровождается крупным сжатием инвестиций, особенно у фирм с высоким риском дефолта; канал идентифицирован через «количество риска» (чувствительность обслуживания долга к глобальным шокам), а не через уровень долга. Для H-002 это внешняя поддержка предпосылки и поправка к дизайну: в SPARK-панели интераксию стоит строить не только на Net Debt/EBITDA, но и на структуре долга — доле короткого, валютного и плавающего долга (проверено 2026-10-25, research-radar-2026-10-25)"
      - "Bandyopadhyay 2026 (arXiv:2610.23901, q-fin.CP, 29.09.2026; выпуск NEP-HRE 2026-10-26; класс B — препринт): DNN на панели коммерческих ипотек 1998–2021 разделяет дефолт по ликвидности и стратегический; при условии просрочки доходность объекта (NOI) важнее левериджа (LTV) для ставки дефолта, пороги устойчивы через 2008 и COVID-19. Поправка к дизайну H-002: фирменное финансовое ограничение задавать потоковой мерой (покрытие процентов, EBITDA к платежам), а Net Debt/EBITDA держать контролем — леверидж хуже объясняет дефолт фирменного заёмщика (проверено 2026-11-01, research-radar-2026-11-01)"
      - "Chapelle, Paul-Venturine, Urvoy 2026 (THEMA WP 2026-12, RePEc:ema:worpap:2026-12; NEP-HRE 2026-10-26; класс A): геопространственная панель 118 муниципалитетов парижского региона, 15 лет, три инструмента зонирования — после национальной отмены FAR в 2014 местные власти компенсировали дерегулирование снижением допустимых высот, ужесточением coverage ratio и ростом отказов в разрешениях; плотность не выросла, эффекта на цены нет; ужесточение сильнее при близких выборах мэров и высоких ценах жилья. Поправка к измерению: формальный регуляторный лимит не равен связывающему ограничению предложения, поэтому мера эластичности для РФ строится на реализованных разрешениях и вводах, а не на нормативных ПЗЗ/КИТ (проверено 2026-11-01, research-radar-2026-11-01)"
    evidence_against: []
    sources: [spark, eiszhc, fnn-opendata]

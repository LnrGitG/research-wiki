    status: proposed
    statement: "Медианные предлагаемые зарплаты из агрегированных вакансий (hh/Superjob/Avito/Работа России, ВНИИ труда) растут быстрее официальных (особенно в 2023), устойчиво сокращают межрегиональное неравенство и опережают региональные ипотечные выдачи на 0–1 квартал — в отличие от Росстата, который завышает неравенство из-за руководителей и вахты. Триангуляция: вакансии ← ФНС (RFSD) ← Росстат."

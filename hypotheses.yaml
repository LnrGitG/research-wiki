    evidence_for:
      - "Опрос Движение.ру (52 девелопера, ввод 2026-2027): 59% проектов с риском срыва сроков из-за нехватки лимита, 55% стартовали с недостаточным лимитом, 43% имели сложности с дофинансированием — сдвиг предложения возникает при отсутствии роста ставки внутри проекта (queries/bank-cost-developers-dvizhenie-survey-20261014.md)"
      - "Механизм 214-ФЗ: привязка эскроу к кредитору исключает альтернативное предложение и делает условия дофинансирования односторонне назначаемыми"
      - "Формализация клина r_eff = r_key + mu - tau в дизайне по селективным формам ДКП: непроцентные платежи входят в mu и не исчезают при снижении ключевой ставки"
    evidence_against:
      - "Самоотчёт класса C с сильным стимулом к преувеличению издержек: доли не проверяемы извне и не имеют контрольной группы"
      - "Отсутствие раскрытого распределения и квартилей не позволяет отделить системный сдвиг от отраслевого нарратива"
      - "Данные ЕИСЖС/КЭП по переносам сроков ввода не собраны в пригодный для идентификации ряд"
    sources: [dvizhenie-survey-20261007, domrf-eiszhc, rosstat-kep]
    tags: [dkp-transmission, credit-channel, developer-finance, housing-supply, non-price-credit-conditions]
    relates_to: ["queries/bank-cost-developers-dvizhenie-survey-20261014", "queries/selective-monetary-policy-growth", "hypothesis:H-002"]
    next_check: "Собрать из ЕИСЖС/КЭП ряд доли перенесённых сроков ввода и объёмов выданного проектного финансирования; регрессия вводов на ключевую ставку с контролем на лимиты, подпериоды до и после 2024"
    created: 2026-10-14
    methodology_ref: "queries/bank-cost-developers-dvizhenie-survey-20261014"

  - id: H-034
    kind: hypothesis
    title: "Рост банковского клина расширяет разрыв между ценой первичного рынка и стоимостью строительства"
    status: testing
    statement: "Если доля банковских расходов в себестоимости проекта растёт быстрее СМР, разрыв между средней ценой квадратного метра на первичном рынке (Росстат) и индексом строительной себестоимости (СМР/ИЦП) должен расширяться, а не быть стабильным."
    evidence_for:
      - "Медианный рост вознаграждения банков в проектах с вводом 2026-2027 за два года 64% (средний 102%) против роста СМР 18% по медиане (20% в среднем), службы заказчика 12%, коммерческих расходов 20% (queries/bank-cost-developers-dvizhenie-survey-20261014.md)"
      - "Медианная доля расходов на проектное финансирование 11,5% выручки, у 22% девелоперов выше 20%; при пересчёте через целевую рентабельность банковские расходы дают свыше 20% цены квадратного метра"
      - "Расчёт по БД 14.10.2026: отношение индекса цен на новостройки ДОМ.РФ к ИЦП на строительную продукцию (kep3_34, сцеплен с янв.2021=100) выросло с 1,085 (дек.2021) до 1,291 (дек.2025) — нестроительная компонента цены за четыре года прибавила около 19% относительно строительных цен"
      - "Шаг вверх разрыва 1,243 (июль 2025) → 1,291 (дек. 2025), около 3,9% за полугодие, по времени совпадает с ужесточением ДКУ и с волной жалоб девелоперов на банковские расходы"
      - "ECM на месячных данных 2021-01..2026-07 (n=64, HAC Ньюи-Уэста, queries/h034-price-cost-gap-spec-20261015.md): прирост разрыва положительно связан с изменением ключевой ставки — коэффициент +0,00106, t=6,34 (устойчиво к окну HAC: t=4,64 при 3 мес., 6,89 при 12 мес.); член коррекции ρ=−0,0178, t=−2,23. Направление и значимость совпадают с ожиданием гипотезы"
      - "Баланс ответов об условиях кредитования в строительстве (КЭП) даёт тот же знак: ужесточение условий расширяет разрыв, коэффициент −0,00011, t=−1,75 в отдельной спецификации и +0,00020, t=2,19 в лаге при совместной"
    evidence_against:
      - "Часть ценового разрыва объясняется землёй, локацией и классом жилья, а не банковским клином"
      - "Разрыв рос не в 2025-2026, а в 2022-2023 (1,178 дек.2022 → 1,232 дек.2023): в 2024 он был плоским (1,252 июль → 1,249 дек.), в июле 2026 остался на уровне дек.2025 (1,292). Ускорения разрыва в период, на который указывает опрос, нет — наблюдение скорее в пользу замещения земельной/маржинальной компоненты, чем добавления банковской"
      - "Сравнение идёт с ценами строительных подрядчиков, а не с полной себестоимостью проекта: рост абсолютной банковской нагрузки при стабильном отношении не исключается"
      - "Расхождение медианы и среднего (64% против 102%) указывает на тяжёлый правый хвост: агрегатный эффект может быть малым при значимом для отдельных проектов"
      - "Величина эффекта мала и в действующем режиме исчезает: в подвыборке 2024-2026 коэффициент при изменении ставки незначим (t=0,61), а лаговый отрицателен (t=−2,06); в уровнях с трендом (R²=0,886) ставка и условия кредитования незначимы, доминирует автономный тренд разрыва около 3,7% в год (+0,00306, t=6,35)"
      - "Идентификация не отделена от спроса: и ключевая ставка, и условия кредитования коррелированы со спросом на жильё, поэтому коэффициент при изменении ставки частично ловит спросовый канал (снижение ставки → рост спроса → ускорение цены), а не только банковскую нагрузку"
      - "Спецификация использует ADF: для уровня разрыва единичный корень не отвергается (t=−2,25), для разности отвергается (t=−3,34) — то есть разрыв не возвращается к постоянному среднему, и «опорный уровень» разрыва, относительно которого гипотеза формулируется как расширение, эмпирически не фиксируется"
    sources: [dvizhenie-survey-20261007, rosstat-prices, rosstat-kep]
    tags: [housing-inflation, cost-push, price-index-gap, developer-finance]
    relates_to: ["queries/bank-cost-developers-dvizhenie-survey-20261014", "queries/h034-price-cost-gap-spec-20261015", "specs/ecm-h034-price-cost-gap.yaml", "queries/eiszhs-sellthrough-regions-20261007", "hypothesis:H-032"]
    next_check: "Выполнено 15.10.2026 (queries/h034-price-cost-gap-spec-20261015.md, specs/ecm-h034-price-cost-gap.yaml, scripts/h034_price_cost_gap.py, прогон воспроизведён на ВМ): ECM 2021-01..2026-07, n=64, HAC. Направление гипотезы подтверждено слабо (θ(Δr)=+0,00106, t=6,34; устойчиво к окну HAC), величина мала, в подвыборке 2024-2026 связь исчезает, в уровнях доминирует автономный тренд разрыва 3,7% в год (θR незначим). Дальше по приоритету: (а) загрузить эффективную стоимость проектного финансирования (средневзвешенная ставка по кредитам застройщикам из банковской статистики ЦБ) — без неё банковский клин не отделяется от спроса; (б) заменить ИЦП подрядчиков на полную себестоимость проекта (земля, подключение, маркетинг) по отчётности девелоперов; (в) панель на 75 регионах с индексом цен ДОМ.РФ при появлении регионального дефлятора СМР; (г) проверить H-035 (липкость клина вниз) на том же каркасе"
    created: 2026-10-14
    methodology_ref: "queries/bank-cost-developers-dvizhenie-survey-20261014"

  - id: H-035
    kind: hypothesis
    title: "Клин стоимости проектного финансирования липкий вниз при снижении ключевой ставки"
    status: proposed
    statement: "При снижении ключевой ставки эффективная стоимость проектного финансирования для застройщика снижается непропорционально: маржа и непроцентные платежи (комиссии, продукты экосистемы, плата за резервирование) не пересматриваются симметрично, поэтому клин относительно ставки растёт."
    evidence_for:
      - "Конструкция вознаграждения 'ключевая плюс маржа 3-5,5% на непокрытую эскроу часть и 3,5-4,5% на покрытую' с капитализацией процентов: непроцентная часть не привязана к ставке (queries/bank-cost-developers-dvizhenie-survey-20261014.md)"
      - "Почти половина застройщиков на старте планировала долю банковских расходов 5%, фактическая превысила 10% у 52% — плановые значения систематически занижены"
    evidence_against:
      - "Положительный опыт, названный респондентами (крупные банки отказываются пересматривать ставки по действующим договорам) может работать и вниз"
      - "Наблюдаемых данных об эффективной стоимости проектного финансирования в разрезе проектов у нас нет"
    sources: [dvizhenie-survey-20261007, cbr-key-rate]
    tags: [dkp-transmission, developer-finance, banking-margin, sticky-prices]
    relates_to: ["queries/bank-cost-developers-dvizhenie-survey-20261014", "queries/selective-monetary-policy-growth"]
    next_check: "При появлении цикла снижения ключевой ставки сопоставить динамику эффективной стоимости проектного финансирования (отчётность застройщиков, ЦБ) с траекторией ключевой ставки на подпериодах смягчения"
    created: 2026-10-14
    methodology_ref: "queries/bank-cost-developers-dvizhenie-survey-20261014"

  - id: H-036
    kind: hypothesis
    title: "Субсидирование ставки застройщиком капитализируется в цену квадратного метра"
    status: proposed
    statement: "Доля сделок с субсидированием ипотечной ставки силами застройщика положительно связана с ценой квадратного метра в проекте при контроле на локацию и класс жилья; субсидия финансируется кредитом и переносится в цену, а не в маржу девелопера."
    evidence_for:
      - "Стоимость субсидии оценивается в 12-18% от суммы ипотечного кредита, по одной оценке 15-18% от выручки проекта, и закладывается в цену квартиры (queries/bank-cost-developers-dvizhenie-survey-20261014.md)"
      - "Механизм согласуется с нашими выводами по международному опыту субсидирования: льгота капитализируется в цену актива, а не достаётся покупателю"
    evidence_against:
      - "Банк не учитывает субсидирование в коммерческих статьях проекта при выдаче проектного финансирования, что может частично разрывать связь субсидии и цены"
      - "Ценовая премия субсидированных лотов может быть скрыта скидками и рассрочками и не проявляться в средних ценах"
    sources: [dvizhenie-survey-20261007, domrf-eiszhc, rosstat-prices]
    tags: [mortgage-subsidy, price-capitalization, housing-inflation, developer-finance]
    relates_to: ["queries/bank-cost-developers-dvizhenie-survey-20261014", "comparisons/subsidirovanie-mezhdunarodnyi-opyt", "concepts/effekt-zamesheniya"]
    next_check: "Панель проект-квартал по ЕИСЖС: доля сделок с субсидированием против цены квадратного метра и динамики скидок; контроль на локацию и класс"
    created: 2026-10-14
    methodology_ref: "queries/bank-cost-developers-dvizhenie-survey-20261014"

    kind: hypothesis
    title: "Wordstat-композит S2–S5 лидирует над yoy СМР на 1 месяц"
    status: rejected
    statement: "Композит поисковых фраз S2+S3+S4+S5 коррелирует ~0.62 с yoy СМР при лаге -1 месяц; S1 (ИЖС) сигнал слабый."

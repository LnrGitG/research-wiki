      - "Репродукция prior на старом окне: corr=+0.6443 (n=18, comp 2025-01..2026-06 -> СМР 2025-02..2026-07) — методика стабильна: monthly mean weekly share по S2-S5, без нормировки на D_broad"
      - "Подпериоды свежего окна: 2025 r=+0.548 (n=12), 2026H1 r=+0.858 (n=6), 2026 r=+0.806 (n=7)"
      - "data/wordstat_weekly_construction.csv, corr=0.63 lead-1m (2026-08)"
    evidence_against:
      - "Ослабление при добавлении одного месяца: 0.644 (n=18) -> 0.618 (n=19); август 2026 предварительный (КЭП янв-авг на 01.10.2026 не вышел, значение из доклада osn-08-2026), изменение в пределах шума"
      - "Короткая выборка (19 мес) и режимный слом 2026-01 (yoy СМР 84.0 при растущем композите): уровневая OLS непригодна, связь реализуется только через MIDAS/алмон по недельным лагам"
      - "Наивный бенчмарк 2026-10-17 (scripts/h001_naive_benchmark.py, queries/h001-naive-benchmark-20261017.md): на окне оценки 2025-02..2026-08 (n=19) наивный перенос даёт MAE 4,67 при RMSE 6,80; композит поверх персистентности — MAE 4,87 (Theil U 1,00), модель прироста 4,69, AR(1) 4,75; направленная точность моделей с композитом 0,447 против 0,5 у наивной. Формально лучше только AR(2) без композита: MAE 4,22, Theil U 0,94"

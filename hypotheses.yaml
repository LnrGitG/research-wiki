    methodology_ref: "queries/bank-cost-developers-dvizhenie-survey-20261014"

  - id: H-037
    kind: hypothesis
    title: "Масштаб льготного кредитования ограничен спросом и издержками отбора, а не остатком лимита"
    status: proposed
    statement: "Реализуемый масштаб программ льготного кредитования ограничен не остатком лимита, а спросом заёмщиков, соответствующих требованиям программы, и издержками отбора и мониторинга на стороне банка. Следствие: остаток лимитов не является оценкой реализуемого потенциала программы."
    evidence_for:
      - "Потолок внутри лимитов на 01.07.2026 — 645,0 млрд руб. (ЭКСАР 75,0 + крупные инвестпроекты 150,0 + инвестпроекты в субъектах 100,0 + МСП 320,0), выбрано 229,2 млрд руб., остаток 415,8 млрд руб. (x1,81); в долях ВВП 0,10% -> 0,28% (queries/ondkp-2027-2029-special-instruments-20261018.md)"
      - "ОНДКП 2027-2029, врезка 13 (стр. 134-138): субсидирование эффективно только когда ограничено по времени и на краткосрочные кредиты; названы четыре издержки масштаба"
      - "Внешний ориентир по утечке стимула: Benetton, Gavazza и Surico (2025, AER 115(3)) — банки снизили ставки по новым ипотекам, но подняли разовые комиссии; Adelino и др. (2026, NBER WP 34824) — поведение заёмщиков сместило около 17% прироста плановых платежей"
    evidence_against:
      - "Оценки ЦБ не включают сельхозипотеку, региональные программы и автокредитование, то есть являются нижней границей охвата; недоучёт части программ ослабляет сопоставление остатка и спроса"
      - "Наблюдаемых данных о числе отклонённых заявок по программам у нас нет: издержки отбора прямо не измерены"
    sources: [cbr-ondkp-2027-2029, cbr-obzor-dkp-2028-plan, ecb-op390]
    tags: [selective-monetary-policy, subsidized-credit, credit-rationing, screening-costs]
    relates_to: ["queries/research-development-recommendations-odkp2028-20261018", "queries/ondkp-2027-2029-special-instruments-20261018", "queries/mp-transmission-housing-credit-dossier-20261018"]
    next_check: "Зарегистрирована задним числом 18.10.2026: формулировка восстановлена из рабочих материалов 18.10.2026, в реестре ранее отсутствовала — сверить формулировку с владельцем. Далее: сопоставить остаток лимитов с динамикой выдач и с числом заявок, если данные появятся"
    created: 2026-10-18
    methodology_ref: "queries/research-development-recommendations-odkp2028-20261018"

  - id: H-038
    kind: hypothesis
    title: "Доля дешёвых кредитов устойчиво превышает охват формальных программ субсидирования"
    status: proposed
    statement: "Доля кредитов, выданных по ставкам ниже рыночных, устойчиво и систематически превышает масштаб, объяснимый охватом формальных программ субсидирования ставки; превышение является измеримым индикатором ненаблюдаемого сегмента нерыночного кредитования."
    evidence_for:
      - "Разрыв между агрегатной долей дешёвых кредитов и охватом программ — наблюдаемая величина, выводимая из Таблицы 13.1 ОНДКП (30 кварталов, шесть диапазонов ставок, I кв. 2019 - II кв. 2026) и раскрываемых XLSX ЦБ за сносками врезки 13"
      - "Внешний ориентир разведения спроса и предложения: врезка ЕЦБ 2025/07 отделяет заявки от одобрений, take-up = доля заявок x доля одобрений (queries/mp-transmission-housing-credit-dossier-20261018.md)"
      - "Bhutta, Keys, Raajkumar 2026 (NBER w35907, Oct 2026, DOI 10.3386/w35907): освобождение от комиссий Fannie Mae/Freddie Mac для малообеспеченных первичных покупателей (2023–2024) — посредники удержали свыше 60% из 1,5 млрд долл. скидок, не передав их заёмщику; сквозной перенос резко различается по кредитным специалистам: у тех, кто исторически выдавал дорогие кредиты, перенос ниже 20%, то есть стимул направлять заёмщика в дорогой кредит сохраняется вопреки посткризисному регулированию. Прямая поддержка H-038 и пробела №6: выгода субсидии присваивается на уровне исполнителя, а не только банка-института, поэтому в РФ-дизайне индикатор нерыночного кредитования надо строить с учётом канала продаж (агентские сети, партнёры застройщика), а не только по ставкам выдач (проверено 2026-10-25, research-radar-2026-10-25)"
    evidence_against:
      - "Абсолютный порог не работает: в III-IV кв. 2020 при ключевой 4,3% в диапазон 4-8% попадало 76,0% и 77,5% выданных кредитов, то есть в низкоставочном режиме индикатор теряет различающую способность"
      - "Ставка и доля льготного кредита определяются совместно: производная рискует поймать реакцию регулятора, а не структурную связь"
    sources: [cbr-ondkp-2027-2029, ecb-ebbox202507_07]
    tags: [selective-monetary-policy, non-market-credit, subsidized-credit, measurement]
    relates_to: ["queries/research-development-recommendations-odkp2028-20261018", "queries/block3-vs-block5-comparison-20261018", "queries/mp-transmission-housing-credit-dossier-20261018"]
    next_check: "Зарегистрирована задним числом 18.10.2026: формулировка восстановлена из рабочих материалов 18.10.2026, в реестре ранее отсутствовала — сверить формулировку с владельцем. До расчётов письменно зафиксировать определение нерыночного кредита и порог Delta"
    created: 2026-10-18
    methodology_ref: "queries/research-development-recommendations-odkp2028-20261018"

  - id: H-VB-1

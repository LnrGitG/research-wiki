    evidence_against: []
    sources: [wordstat, gdelt, eiszhc, rosstat-smr]
    tags: [nowcasting, mixed-frequency, search-data, leading-indicators]
    relates_to: ["queries/search-nowcasting-construction", "H-001", "reviews/feds-2026-068-garcia-alban-gonzalez-astudillo-bells-whistles-nowcasting"]

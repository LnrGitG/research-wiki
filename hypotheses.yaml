      - "Soltas & Gruber 2026 (Princeton CEPS WP 352, 02.2026; в дайджесте NEP-HRE-2026-10-12): implicit market «ready-to-issue» разрешений в округе Лос-Анджелес, repeat-listing DiD — за землю с уже полученным разрешением застройщики платят на 50% больше (48 долл./кв. фут), а предодобрение повышает вероятность завершить стройку в течение четырёх лет с момента покупки участка на 10 п.п. (то есть на 30%); разрешительные издержки объясняют около трети разрыва между ценой жилья и стоимостью строительства. Для H-013 это подтверждение ключевой предпосылки: разрешение не просто маркер, а датированный опцион, и срок его «срабатывания» измеримо предсказывает ввод; масштаб лага — годы, а не кварталы (проверено 2026-10-18, research-radar-2026-10-18)"
      - "D'Amico, Soltas & Wang 2026 (Princeton CEPS WP 357, 09.2026; в дайджесте NEP-HRE-2026-10-12): длительности permitting и development по стандартизованным проектам в 60 городах США, 2000–2025 — самые быстрые города успевают построить за то время, которое самым медленным нужно только на согласование; длительность согласования положительно связана с ценами жилья и отрицательно с объёмом строительства (по силе связи сопоставима с другими мерами земельного регулирования), а сама длительность росла монотонно, тогда как общая длительность проекта колебалась циклически. Прямая поддержка H-013: длительность разрешительного этапа — самостоятельный модулятор опережения, и её надо брать когортно, а не как константу (18–30 мес), потому что она дрейфует вверх (проверено 2026-10-18, research-radar-2026-10-18)"
    next_check: "Построить когортные кривые готовности по регионам; тест: отклонение скорости готовности от когортного тренда → ввод t+2..3 кв."
    sources: [domrf, rosstat]
    tags: [supply, construction-cycle, nowcasting, spatial]

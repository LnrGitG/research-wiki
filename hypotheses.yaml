  - id: H-005
    kind: hypothesis
    title: "Интеракция МПЛ × эластичность предложения региона определяет эффект лимитов"
    status: active
    statement: "Макропруденциальные лимиты (МПЛ, DSTI) сильнее снижают цены в регионах с высокой эластичностью предложения (эффект через ограничение спроса при гибком предложении) и почти не действуют в неэластичных регионах (Санкт-Петербург, Москва), где вместо цен сжимаются транзакции."
    evidence_for:
      - "ЦБ 2025: МПЛ снизили долю высокорисковых кредитов 46%→3%"
      - "Лаптева 2025: лаг 2 квартала, длительность ~6 месяцев"
      - "Региональная гетерогенность (Demidova 2025, Zvereva 2025)"
      - "Polat, Marfatia, André, Gupta 2026 (Univ. Pretoria WP 202630, 09.2026, RePEc:pre:wpaper:202630): сетевой TVP-VAR (15 узлов, дневные 2007–2026) — наибольшие регуляторные шоки поглощают рынки с неэластичным предложением (Нью-Йорк 45,5%, Сан-Диего 48,8%, Сан-Франциско 39,8%); дерегулирование передаётся в условия ДКП (теневой ставка >0 в 87,7% наблюдений). Эмпирическая поддержка механики интеракции МПЛ × эластичность: неэластичные рынки реагируют на регуляторный шок не ценой (проверено 2026-10-11, research-radar-2026-10-11)"
      - "Zavacky & Melecky 2026 (International Review of Economics & Finance 112:105969, DOI 10.1016/j.iref.2026.105969, open access, онлайн 13.10.2026): панельный VAR по 19 странам еврозоны с теневой ставкой (unconventional policy) и самостроенным индексом макропруденциальной политики на базе IMF iMaPP — ужесточение ДКП устойчиво снижает реальные цены жилья, а ужесточение макропруденциальной политики в среднем незначимо; но в нормальном режиме (вне ZLB) значимо отрицательный эффект даёт уже и макропруденциальный шок. Для H-005 это условная поддержка: нулевой средний эффект МПЛ не опровергает гипотезу, потому что в выборке смешаны режимы ZLB и нормального цикла, а РФ 2023–2026 — нормальный режим; интеракция с эластичностью предложения при этом не тестируется, поэтому прямой проверки РФ-механики нет (проверено 2026-10-18, research-radar-2026-10-18)"
    evidence_against:
      - "de Leuw, Francke, van Dijk 2026 (DNB Working Paper 874, Oct 2026, RePEc:dnb:dnbwpp:874): административные сделки Нидерландов 2006–2024 — уверенность предсказывает участие на обеих сторонах рынка (у покупателей сильнее), а условно на участии покупатели с более позитивными ожиданиями платят на 2,2% больше, в наиболее ограниченных по предложению рынках — на 4,4%; уверенность продавцов на цены не влияет. Это КОСВЕННЫЙ аргумент против направления, заявленного в H-005: спросовый шок транслируется в цену сильнее там, где предложение НЕэластично. Тестом МПЛ работа не является (другой шок, другой инструмент), поэтому статус не меняется, но premise гипотезы требует переформулировки: сравнивать ценовой и количественный отклик по эластичности надо как проверяемое утверждение, а не как предпосылку (проверено 2026-10-25, research-radar-2026-10-25)"
      - "Murphy, Shaheen 2026 (Dallas Fed Working Paper 2635, October 2026, DOI 10.24149/wp2635): прямое опровержение Louie–Mondragon–Wieland (2025) на тех же данных — интеракция роста доходов с мерами ограничений предложения значима во всех шести спецификациях: долгосрочная разность 2000–2020 даёт −0,242 (0,037) при эластичности Saiz, −1,384 (0,354) при Baum-Snow–Han, −0,297 (0,044) при WRLURI, −2,320 (0,258) при земельной доле Davis et al.; годовые IV-оценки с фиксированными эффектами MSA и года — −0,116 (0,043) и −0,649 (0,235) соответственно (N 6 798–9 748). Второй независимый аргумент того же направления, что и de Leuw et al. 2026: ценовой отклик на спросовый шок концентрируется там, где предложение НЕэластично, то есть ценовая часть premise H-005 эмпирически не поддерживается. Тестом МПЛ работа не является (шок — доходы, США), статус не меняется; в реестр заносится впервые — в радаре 2026-10-18 она упоминалась только как контекст H-002 (проверено 2026-10-26, research-radar-2026-10-26)"
      - "Beyer, Biljanovska, Fotiou, Maneely, Toscani 2026 (IMF Working Paper WP/26/177, 28.08.2026, DOI 10.5089/9798229058599.001, 47 стр.): структурный VAR по Европе — предложенческие факторы стали доминирующим драйвером цен жилья, в отличие от кредитного роста перед GFC; по EU-SILC вероятность перехода арендатора в собственники у финансово уязвимых домохозяйств упала более чем вдвое против предкризисного периода, а ограничения доступности дали около 1 млн несвершившихся переездов внутри ЕС за десятилетие. Работа ранее не попадала в вики и впервые заносится в реестр; направление согласуется с Murphy–Shaheen 2026 — цены реагируют на ограничения предложения, что противоречит ценовой части premise H-005. Прямого теста МПЛ нет, статус остаётся active (проверено 2026-10-26, research-radar-2026-10-26)"
      - "Škrinjarić 2026 (BoE Staff Working Paper No. 1 193, July 2026; класс A, добор вне 7-дневного окна): квантильная регрессия распределения роста цен жилья по Великобритании (национальный уровень и 12 субнациональных единиц, горизонт до двух лет) — главные предикторы хвоста: рост транзакций, изменение ипотечной ставки, кредит-к-ВВП и финансовый стресс; коэффициенты при ипотечной ставке выше в регионах с неэластичным предложением, а рост предложения связан с последующим ослаблением цен. Четвёртый независимый аргумент того же знака, что DNB 874, Dallas Fed 2635 и IMF WP/26/177: ценовой отклик концентрируется в неэластичных рынках. Шок — ставка, а не МПЛ, поэтому статус не меняется (проверено 2026-11-01, research-radar-2026-11-01)"

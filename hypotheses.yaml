  - id: H-VB-2
    kind: hypothesis
    title: "Опережение ВБВЭД над ипотекой существует на агрегате, но не идентифицируется в разрезе регионов"
    status: narrowed
    statement: "Связь ВБВЭД (год к году) с кредитно-спросовыми индикаторами жилищного рынка синхронна: лаг не идентифицируется ни на региональной панели (с месячными FE коэффициент незначим), ни на национальном агрегате (лаговое опережение на 6-9 месяцев не выдерживает проверки на единичный корень, на ускорениях и после детренда). Устойчивая часть — синхронная связь около +0,02 п.п. выпуска на 1 п.п. отклонения выдач ИЖК от годового темпа, неотделимая от общего тренда замедления ВБВЭД."
    test: "Панель регион x месяц 2022-01…2026-08: S0 — только региональные FE, S1 — региональные и месячные FE; ошибки, кластеризованные по региону; профиль по лагам 0-12; контроль на промпроизводство на том же лаге."
    data: "vbved_reg_m, cbr_izhk_volume_m, cbr_izhk_count_m, ddu_count_m, ippsm"
    evidence_for:
      - "S0 (общий цикл): объём выдач ИЖК на лаге 6 мес — +0,013 п.п. при t 6,24, число кредитов +0,018 при t 6,38, профиль положителен на всех лагах 0-12 с максимумом на девятом (t 7,9)"
      - "Поперечная проверка по ИФО ВРП: corr 0,60 (2022), 0,57 (2023), 0,25 (2024); пул 279 наблюдений, наклон 0,27, t 3,29, R² 0,23"
    evidence_against:
      - "S1 (месячные FE снимают общий цикл): объём ИЖК +0,007 при t 0,78, число кредитов +0,017 при t 1,17, ДДУ +0,001 при t 1,20; профиль по лагам 0-12 плоский, максимум t 1,5"
      - "Межрегиональное сечение средних за период: corr 0,21 (объём) и 0,24 (число кредитов), наклон 0,108 при t 1,56, R² 0,05"
      - "Устойчивость: подвыборка 2023+ даёт +0,006 (t 0,52), контроль на промпроизводство и тренд региона картину не меняют (+0,007, t 0,78)"
      - "Национальный агрегат (queries/vbved-national-aggregate-20261025.md, 56 месяцев 2022-01..2026-08): в уровнях связь положительна (+0,0147, t 1,81 простой; +0,0210, t 2,50 взвешенный по ВРП-2024), но зависимая нестационарна (ADF -1,98, p 0,294 и -2,58, p 0,096) при стационарном регрессоре (ADF -3,39, p 0,011) — несбалансированная регрессия"
      - "ADL с лагами ипотеки 0-6 (HAC 12): значимы соседние лаги с разными знаками (k4 -0,0112 t -1,97; k5 +0,0173 t 3,59; k6 -0,0097 t -2,72) — признак коллинеарности перекрывающихся yoy-окон, а не канала"
      - "На ускорениях (первые разности г/г) связь исчезает: |corr| <= 0,26 со скачущим знаком на всех лагах 0-9. После детренда обоих рядов профиль плоский (0,36 на k=0; 0,37-0,48 на k=-9..-1) без пика на 6-м месяце; отрицательные значения на k>=3 — артефакт (у самой ипотеки corr(yoy_t, yoy_(t+12)) = -0,408)"
      - "Стационарная зависимая: прирост ВБВЭД на уровень ипотеки при контроле на собственный лаг прироста незначим на всех лагах 0-9 (|t| <= 1,91), доминирует возврат к среднему (-0,444, t -5,0). В регрессии с трендом значим сам тренд (-0,0943 п.п./мес, t -2,02), то есть кажущаяся связь отражает замедление ВБВЭД на 1,1-1,9 п.п. в год"
      - "Шаг с межрегиональной долей льготных выдач не выполнен: шесть метрик семейства (lshare_m, lgot_count_w, lgot_volume_w, rf_lshare_m, rf_lgot_count_m, rf_market_count_m) — карточки без наблюдений (count(*) = 0)"
    sources: [emiss-62024, cbr, domrf, rosstat]
    tags: [vbved, panel, fixed-effects, identification, nowcasting]
    relates_to: ["queries/vbved-panel-regions-20261021", "queries/vbved-cross-correlation-20261021", "queries/vbved-national-aggregate-20261025", "scripts/vbved_national_aggregate.py"]
    next_check: "Выполнено 25.10.2026 (queries/vbved-national-aggregate-20261025.md, scripts/vbved_national_aggregate.py): национальный агрегат проверен на 56 месяцах 2022-01..2026-08 двумя способами (простой средний по 91 региону и взвешенный по ВРП-2024, 85 субъектов). Связь в уровнях положительна и значима (+0,0147 t 1,81; +0,0210 t 2,50), но лаговое опережение не подтверждается: зависимая I(1) при стационарном регрессоре, значимые лаги в ADL чередуют знак (k4 -, k5 +, k6 -), на ускорениях связь исчезает (|r| <= 0,26), после детренда профиль плоский без пика на 6-м месяце, на стационарной зависимой коэффициент незначим (|t| <= 1,91). Остаётся синхронная связь около +0,02 п.п. на 1 п.п. отклонения выдач, неотделимая от тренда замедления ВБВЭД (тренд -0,0943 п.п./мес, t -2,02). Предложение: перевести гипотезу в narrowed с формулировкой «связь синхронна, лаг не идентифицируется» (решение владельца). Остаток: загрузить фактические льготные выдачи по регионам — шесть метрик семейства существуют как карточки без наблюдений, поэтому шаг с идиосинкратическим шоком заблокирован"
    created: 2026-10-21
    methodology_ref: "queries/vbved-panel-regions-20261021"


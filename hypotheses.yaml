  - id: X-003
    kind: contradiction
    title: "Асимметрия ДКП (сдерживание сильнее смягчения): US-литература vs отсутствие РФ-эмпирики"
    status: active
    statement: "Wang (2024) для США: сдерживающая ДКП влияет на цены жилья сильнее стимулирующей; в РФ за 2020-2026 доминирует эпизод мягкой политики (2020-2022) + один эпизод ужесточения (2023-2025) — сопоставимой симметрии оценить нельзя, а российские оценки (Sinyakov 1.5-2.3% на 1 п.п.) предполагают слабый линейный эффект."
    evidence_for:
      - "Wang 2024 (США): асимметрия значима, сдерживание сильнее"
      - "Sinyakov & Shelovanova 2025 (РФ): слабая эластичность спроса по ставке"
      - "Graybill & Mangum 2026 (Philly Fed WP 26-33, rev. 2026-09): покупатели чувствительнее к ипотечной ставке, чем продавцы к lock-in — снижение ставки растит объёмы сделок, но не снимает тайтнесс (асимметрия спрос/предложение внутри трансмиссии; косвенная поддержка, проверено 2026-09-14, research-radar-2026-09-14)"
      - "Bracke, Cocco, Markoska, Tak 2026 (BoE SWP 1203, Aug): вокруг шока 23.09.2022 заёмщики сместились к двухлетним фиксациям несмотря на их цену, ища близкую гибкость ради equity extraction при снижении ставки; рост ставки на 200 б.п. → LTV −2–3 п.п. — поведенческая асимметрия заёмщика к ожидаемой траектории ставки (проверено 2026-09-28, research-radar-2026-09-28)"
      - "Pfarrhofer & Stelzer 2026 (arXiv:2609.37168, 29 Sep): нелинейная mixed-frequency VAR с BART по еврозоне — знаковая асимметрия доминирует: ужесточение передаётся в согласии с теорией, смягчение любого размера даёт в основном незначимые отклики; пиковые эффекты зависят от начальных условий (проверено 2026-10-04, research-radar-2026-10-04)"
    evidence_against:
      - "Bonam, van Dijk, Goy, Zhu (DNB Working Paper 872, RePEc:dnb:dnbwpp:872): глобальная VAR-X по городам и странам с учётом трансграничного владения коммерческой недвижимостью — шок количественного смягчения США даёт устойчивый рост цен коммерческой недвижимости и внутри США, и за рубежом, с расширением кредита преимущественно внутри США; в открытой новокейнсианской модели с рынком коммерческой недвижимости ключевой канал — рост иностранного спроса на зарубежные активы, а спилловеры возвращаются в США по торговым связям. Для X-003 это слабый контрапункт сильной асимметрии: смягчение здесь отнюдь не бессильно, оно устойчиво двигает цены активов (класс актива — коммерческая, а не жилая недвижимость; рынок — США и глобальный, не РФ). Статус противоречия не меняется: тестом жилищной асимметрии в РФ работа не является (проверено 2026-10-25, research-radar-2026-10-25)"

      - "Корреляция изменений Δкомпозит vs ΔСМР = −0,049: информация о годовом темпе не содержится в изменениях поискового спроса; персистентность самого yoy-ряда (y_t vs y_t+1) +0,528 объясняет большую часть уровневой связи"
      - "Спецификация уровневой регрессии на композите как прогнозное уравнение непригодна: MAE 35,3, Theil U 5,27 — трендовый регрессор экстраполирует за пределы разумного"

# Реестр датасетов v2 — карточки источников
# Каждый датасет = один продукт источника. Парсер пишется под карточку,
# не под справочники БД. Добавление источника = карточка + парсер.

datasets:
  # ===== РОССТАТ =====
  - dataset_code: rosstat-kep-1
    source: rosstat
    name_ru: Краткосрочные экономические показатели (раздел 1, промышленность)
    release_url: https://rosstat.gov.ru/statistics/kratkosrochnye-pokazateli
    schedule: monthly, 5-7 числа
    file_glob: 'raw/rosstat/kep/**'
    status: active
    notes: ИПП, ИФО секций B-E. Пишет в prom_products_monthly (v1) - переносится в v2.

  - dataset_code: rosstat-doklad
    source: rosstat
    name_ru: Доклад «Социально-экономическое положение России» (Приложения)
    release_url: https://rosstat.gov.ru/storage/mediabank/DOKLAD_2026.htm
    schedule: monthly, ~2 число
    file_glob: 'raw/rosstat/doklad_2026/**'
    status: active
    notes: Парсинг .doc catdoc. Ввод/СМР/инвестиции по регионам.

  - dataset_code: rosstat-emiss-34118
    source: rosstat
    name_ru: ЕМИСС 34118 - ввод жилья по субъектам (мес)
    release_url: 'https://rosstat.gov.ru/folder/11109 (dataGrid.do id=34118)'
    schedule: monthly, регламент <=14 числа
    status: active
    notes: 'РФ-агрегат = сумма субъектов (ФО исключать). Метрики 57984/57985 в core.'

  # ===== ЦБ =====
  - dataset_code: cbr-vfs-0420218
    source: cbr
    name_ru: Форма 0420218 «Сведения об ипотечном жилищном кредитовании» (VFS)
    release_url: https://cbr.ru/vfs/
    schedule: monthly, ~12 число
    file_glob: 'raw/cbr/vfs/*.xlsx'
    status: active
    allowlist_sheets:
      - 02_04_New_loans_ind
      - 02_05_Debt_ind
      - 02_06_Quantity_housing
      - 02_07_New_loans_housing
      - 02_08_Rates_housing
      - 02_09_Debt_housing
      - 02_15_Quantity_scpa_mortgage
      - 02_42_Quantity_mortgage_ihc
      - 02_43_New_loans_mortgage_ihc
      - 02_44_Share_mortgage_ihc
      - 02_45_Rates_mortgage_ihc
    notes: 02_16/17/18 исключены владельцем 21.09. Валютные срезы после 2022 (91% нулей) отбрасываются правилом карточки.
    source_links:
      file_ref: 'ВМ ~/Lab/tree/CBR_ИпотекаРФ.txt'
      rf_series:
        02_01_Housing: https://www.cbr.ru/vfs/statistics/BankSector/Mortgage/02_01_Housing.xlsx
        02_02_Mortgage: https://www.cbr.ru/vfs/statistics/BankSector/Mortgage/02_02_Mortgage.xlsx
        02_41_Mortgage_ihc: https://www.cbr.ru/vfs/statistics/banksector/mortgage/02_41_Mortgage_ihc.xlsx
        02_46_Mortgage_SA: https://www.cbr.ru/vfs/statistics/banksector/mortgage/02_46_Mortgage_SA.xlsx
      regional_series:
        02_06_Quantity_housing: https://www.cbr.ru/vfs/statistics/BankSector/Mortgage/02_06_Quantity_housing.xlsx
        02_07_New_loans_housing: https://www.cbr.ru/vfs/statistics/BankSector/Mortgage/02_07_New_loans_housing.xlsx
        02_42_Quantity_mortgage_ihc: https://www.cbr.ru/vfs/statistics/banksector/mortgage/02_42_Quantity_mortgage_ihc.xlsx
        02_43_New_loans_mortgage_ihc: https://www.cbr.ru/vfs/statistics/banksector/mortgage/02_43_New_loans_mortgage_ihc.xlsx


  # ===== ДОМ.РФ =====
  - dataset_code: domrf-price-index
    source: domrf
    name_ru: Индекс цен на жилье (первичка), база 100
    release_url: https://наш.дом.рф/аналитика/статистические_ряды
    schedule: monthly
    file_glob: 'raw/domrf/price_index/*'
    status: active
    notes: 'CSV 5025 строк, 75 регионов. itzdr (index), itzdrpm (pct м/м), csdr (сделки).'

  - dataset_code: domrf-statseries
    source: domrf
    name_ru: Статистические ряды ДОМ.РФ (ввод, ДДУ, продажи, разрешения, готовность)
    release_url: https://наш.дом.рф/аналитика/статистические_ряды
    schedule: monthly
    file_glob: 'raw/domrf/**'
    status: active
    notes: >
      Ядро 8 data_type (stock/flow/sales/ddu/permits/readiness); нежилые/паркинги/КРТ-прогнозы не загружать.
      Конвейер №6 (pipeline6_domrf_statseries.py, 21.09.2026, run 45): региональные
      sales+ddu из staging.rosstat_construction__domrf_indicators → 8 метрик
      (domrf_sales_m2_level, domrf_sales_pct_level, domrf_ddu_active_cnt/m2/rub,
      domrf_ddu_escrow_cnt/m2/rub), 42 294 obs, 2020-01…2026-08 (DDU с 2021-01),
      ~99 регионов + РФ (region_id 1). Показатели — уровни «на дату» (накопленная
      реализация в строящихся домах, действующие ДДУ), не потоки; помесячный поток =
      diff в аналитике. Спот-чеки: Белгородская ДДУ авг-2026 = 2138, sales м2 = 356214.36.
      Остаток: stock/flow/permits/readiness (ядро-кандидаты для Г-цикл).
      Конвейер №7 (pipeline7_domrf_stockflow.py, 21.09.2026, run 49): 14 метрик —
      domrf_stock_bld_cnt/m2, domrf_stock_flats_cnt (214-ФЗ сток), domrf_flow_bld_cnt/m2/flats_cnt
      (проектные декларации за период), domrf_permits_stock_cnt/m2/liv_m2 и
      domrf_permits_flow_cnt/m2/liv_m2 (разрешения: действующие/выданные),
      domrf_uf_volume_mln_m2 + domrf_readiness_rf (агрегаты РФ). 71 386 obs.
      Питфоллы: один indicator_code на два data_type (permits stock/flow);
      названия readiness-рядов лежат в region_name; %% в литералах psycopg.

  # ===== МИНФИН =====
  - dataset_code: minfin-budget-q
    source: minfin
    name_ru: Кассовое исполнение федбюджета по разделам (кв)
    file_glob: 'raw/minfin/**'
    status: active
    notes: |-
      Раздел 04 (нацэкономика), субсидии СП. Касса 2022+ не собрана.
      Справочник vr_kosgu_2024_2026.xlsx — КОСГУ/КВР-классификатор, НЕ данные.

  # ===== МИНФИН / iМониторинг (КРИСТА) — региональные бюджеты =====
  - dataset_code: iminfin-regbudget
    source: minfin
    name_ru: Региональные бюджеты субъектов (iМониторинг КРИСТА)
    file_glob: 'raw/iminfin/**'
    status: selective
    notes: |-
      www.iminfin.ru (НПО КРИСТА / Финмониторинг): исполнение расходов
      субъектов (нарастающий итог на дату, 101 регион × 13 показателей),
      межбюджетные трансферты, госдолг, кредиты, финпаспорт, нацпроекты.
      Скрап только с ВМ YC через playwright (~/.local/bin/node,
      npm-кеш 1.63.0, chromium-1243); BI-хосты copen-imon/wf-imon.fm.epbs.ru
      не отвечают с VPS (гео). Данные: POST /redirect/copen-imon/Data?uuid=…
      через iminfin-прокси; дефолтный снапшот — один период на дату,
      история — интерактивные клики (отдельная задача). Снапшот 2026-09-21:
      raw/iminfin/2026-09-21/ (6 страниц). Нацпроекты: разрез ФО × период.

  # ===== ФНС =====
  - dataset_code: fnso-quarterly
    source: fnso
    name_ru: ФНС открытые данные, квартальные (1-НОМ, прибыльные орг., НДФЛ)
    release_url: https://pb.nalog.ru/
    schedule: quarterly, +4 мес
    file_glob: 'raw/fns/**'
    status: active
    notes: Фильтр filed=1 AND line_2110>0 (~25К фирм).

  # ===== ЯНДЕКС =====
  - dataset_code: yandex-wordstat
    source: yandex
    name_ru: Wordstat, 20 фраз СМР x 5 групп
    schedule: weekly
    status: active
    notes: Композит S2-S5. Клиент scripts/wordstat_api.py.

  - dataset_code: rosstat-kep-operational
    source: rosstat
    name_ru: КЭП + Информация для мониторинга (оперативные доклады)
    release_url: https://rosstat.gov.ru/folder/11109
    schedule: weekly/monthly
    status: active
    notes: Питал observations 50К в v1 sqlite. Перенос ядро-только.

  # ===== СБЕРИНДЕКС =====
  - dataset_code: sberindex
    source: sberindex
    name_ru: СберИндекс (СберБанк/Домклик) — рынок жилья и бизнес-ряды
    release_url: https://www.sberbank.com/ru/sberindex
    schedule: monthly
    file_glob: 'raw/sberindex/*.parquet'
    status: active
    notes: >
      7 parquet (выгрузка 21.09.2026, zip из JupyterLab ВМ ~/SberIndex/):
      динамика цен объявлений (руб/м2, Домклик, 84 рег x 4 price_type, 2022-01…2026-08),
      предложения недв. (кол-во объявлений, те же разрезы), сделки (медианная цена сделки,
      руб, 86 рег x первичка/вторичка, 2017-01…2026-08), цены предложения жилой недв.
      (руб/м2, 82 рег x 3 novelty x 2 type, 2022-10…2026-08), медианная зарплата
      (19 отраслей, РФ, 2020-01…2026-07), объём ФОТ (20 отраслей, 2017-02…2026-06),
      обороты бизнеса (20 отраслей, 2017-01…2026-08). Все месячные, obs_status A.
      Ядро v2: 12 housing-метрик (разрезы Первичный/Вторичный + novelty; классы
      бизнес/эконом-комфорт, бизнес-ряды отраслевые — вне ядра, не загружать в v2 пока).
      Алиасы: plain Архангельская/Тюменская/Кемеровская → уточнённые (как ДОМ.РФ).
      Периоды: Домклик-файлы 1-е число, остальные end-of-month.

  # ===== ДОМ.РФ weeklyreport (льготные программы) =====
  - dataset_code: domrf-lgot-weeklyreport
    source: domrf
    name_ru: ДОМ.РФ weeklyreport — еженедельные снимки льготных программ (psm/itm/sip/dfo)
    release_url: https://наш.дом.рф/аналитика/weeklyreport
    schedule: weekly
    file_glob: 'raw/domrf/weeklyreport/**'
    status: active
    notes: >
      Еженедельные снимки выдач по 4 программам: lgot8 (Льготная 8%, кумулятив —
      поток = декумулирование), family (Семейная, недельные значения), it (ИТ,
      недельные), fareast (Дальневосточная и арктическая, недельные, колонка
      «Заключено»). Разрезы: регион × кредитор (сводная строка региона —
      creditor IS NULL). 1023 снимка с 26.12.2019, ~1.09 млн строк.
      Питфоллы: (1) lgot8 — кумулятив, требует декумулирования; (2) первый
      снимок family 2022-11-16 — кумулятив (368 561 шт), отбрасывается;
      (3) снимок 2023-03-01 — выброс (донаследование отчётности, х8);
      (4) строки ХМАО/ЯНАО в отчётах неполные — занижение автономных округов;
      (5) fareast: колонка issued_* не заполнена, использовать concluded_*.
      Сверка: семейная июнь 2026 — 217.3 млрд из недель vs ~212 млрд
      официальных (расхождение 2.4%, границы недель). Таблица: public.domrf_lgot_mortgage.
      Собрано профилем personal 30.09.2026. Кандидат: v2 dataset_id=11,
      домен 4 (credit), частота W (1). Метрики-кандидаты: lgot_count_w (шт),
      lgot_volume_w (млн руб) — по 4 программам × регион × кредитор.

  # ===== ЦБ региональная статистика жилищных кредитов =====
  - dataset_code: cbr-vfs-regional
    source: cbr
    name_ru: ЦБ РФ формы 02_06/02_07/02_13 — региональный разрез ЖИК и ставки ИЖК
    release_url: https://cbr.ru/vfs/statistics/BankSector/Mortgage/
    schedule: monthly, ~12 число
    file_glob: 'raw/cbr/vfs/02_06*,02_07*,02_13*'
    status: active
    notes: >
      Расширение cbr-vfs-0420218 (dataset_id=4): региональные срезы форм 02_06
      (количество жилищных кредитов), 02_07 (выдача жилищных кредитов) и 02_13
      (средневзвешенные ставки по ИЖК в рублях по субъектам). 92 месяца
      (2019-01..2026-08), по субъектам РФ. Питфолл: Тюменская область даётся в
      трёх строках (вся / без АО / отдельно Югра, ЯНАО) — сверка:
      июль 2026: 1300+1616+721=3637 (сходится). Питфолл двойного счёта: в
      report_type='region' строки банков идут с region=области; сводная строка
      региона — creditor IS NULL. Таблицы: public.cbr_housing_loans (02_06+02_07),
      public.cbr_mortgage_rates (02_13). Собрано профилем personal 30.09.2026.
      Кандидат: v2 dataset_id=12, домен 4 (credit), частота M (2).
      Метрики-кандидаты: cbr_housing_loans_count_m, cbr_housing_loans_volume_m
      (02_06/02_07, региональные, — расширение метрик 30-36 из агрегатных в
      региональные); cbr_mortgage_rate_reg_m (02_13 — новый ряд: ставка по
      субъектам, дополнение cbr_izhk_rate_m id=33).

  # ===== Панель доли льготных выдач (Урал) =====
  - dataset_code: ufo-panel-lshare
    source: derived
    name_ru: Панель доли льготных выдач (Уральский макрорегион, 9 субъектов)
    schedule: monthly
    status: active
    notes: >
      Производный датасет: числитель — ДОМ.РФ family+it+fareast (только сводная
      строка региона, creditor IS NULL), знаменатель — ЦБ 02_06 (количество
      жилищных выдач). 9 уральских регионов × 91 месяц (2022-05..2026-08).
      2022-11 исключён (известный выброс), доли >105% отфильтрованы.
      Медианные доли по Уралу (шт): Свердловская 37%, Башкортостан 29%,
      Пермский 31%, Оренбургская 25%, Челябинская 22%, Курганская 19%; пик
      2025-07 (Свердловская 74.6%), к 2026-07 снижение до 30–41%.
      Таблица: public.ufo_panel_lshare. Собрано профилем personal 30.09.2026.
      Кандидат: v2 dataset_id=13, домен 4 (credit), частота M (2),
      unit_id=9 (share). Метрика-кандидат: lshare_m (доля льготных выдач).
      Назначение: переменная lshare в дизайне трансмиссии ДКП (β<0 —
      чем выше льготная доля, тем слабее реакция на ставку).

  # ===== Росстат квартальные цены 1 кв.м (дополнение) =====
  - dataset_code: rosstat-housing-prices-q
    source: rosstat
    name_ru: Росстат — средние цены 1 кв.м жилья (первичка/вторичка, квартальные)
    release_url: https://rosstat.gov.ru/statistics/zhilishchnoe-stroitelstvo
    schedule: quarterly, +35 дней
    file_glob: 'raw/rosstat/prices/**'
    status: active
    notes: >
      Квартальные средние цены 1 кв.м первичного и вторичного жилья по субъектам.
      Файлы sred_cen_perv/vtor за 2021–2026 (кэш /tmp/rosstat_prices.pkl,
      440 ячеек, 9 регионов, без пропусков). Пример: первичка Башкортостан
      77 464 (2021Q1) → 148 632 (2026Q2); вторичка Свердловская 98 431 (2024Q4).
      Особенность: ранние кварталы 2021 у Росстата повторяются (пересчёт базы) —
      учесть в оценках. ДУБЛЬ catalogue metric 1099 tkzk (v2 metric_id=17,18 —
      price_new_m2, price_secondary_m2): каталог длиннее, мой слой даёт
      последний квартал раньше. РЕШЕНИЕ: регистрировать как расширение
      существующих метрик 17/18 в региональный разрез (native_code в
      metric_dataset_map), а не как новые метрики. Таблица:
      public.rosstat_housing_prices. Собрано профилем personal 30.09.2026.
      Кандидат: v2 dataset_id=14, домен 2 (prices), частота Q (3),
      unit_id=3 (bld_rub_m2). Метрики: расширение price_new_m2 (id=17) и
      price_secondary_m2 (id=18) через metric_dataset_map.

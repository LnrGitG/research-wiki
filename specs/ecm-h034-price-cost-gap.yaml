# H-034: разрыв «цена новостройки минус стоимость строительства» и банковский клин.
# Дизайн: ECM (двухшаговая форма) на месячных данных РФ; идентификация — через
# изменения ключевой ставки и баланса ответов КЭП об условиях кредитования в
# строительстве. Текст постановки: queries/h034-price-cost-gap-spec-20261015.md.
name: ecm-h034-price-cost-gap
version: 2
kind: model
model: ardl
target:
  metric_code: h034_gap_log
  frequency: m
  region_id: 1
  construction: "g_t = ln(domrf_price_index_m / domrf_price_index_m[2021-01]) - ln(kep3_34_chained / kep3_34_chained[2021-01])"
features:
  - metric_code: cbr_key_rate
    frequency: m
    lags: [0, 1]
    transform: diff
    frequency_aggregation: mean
    role: financing_cost_proxy
  - metric_code: cbrmon__stroitelstvo__ekonomika_vsego__ishodnye_dannye__kak_izmenilis_usloviya_kreditovaniya_balans_otvetov
    frequency: m
    lags: [0, 1]
    transform: diff
    role: lending_conditions_proxy
    note: "код разрешается по фрагментам (pick_code): harmonize сменил размерную группу «все» на «ekonomika_vsego»"
  - metric_code: cbr_pf_rate_ru_m
    frequency: m
    lags: [0, 1]
    transform: diff
    role: project_finance_rate
    note: "фактическая средневзвешенная ставка по договорам проектного финансирования, с 2022-01"
  - metric_code: h034_gap_log
    frequency: m
    lags: [1, 2, 3]
    transform: diff
    role: autoregressive
sample:
  start: "2021-01"
  end: "2026-08"
  note: "базовая выборка 68 месяцев (2021-01…2026-08); с фактической ставкой ПФ — 56 (2022-01…2026-08)"
exclusions:
  - "нет: выборка непрерывная, пропусков в пересечении ряды не имеют"
structural_breaks:
  - "2022-03 — шок и всплеск ставки"
  - "2023-08 — начало цикла повышения"
  - "2024-07 — завершение массовой льготной ипотеки"
  - "2024-10 — ключевая ставка 21%"
standard_errors:
  type: hac
  kernel: bartlett
  bandwidth:
    rule: "фиксированный набор 3/6/9/12 месяцев (в отчёте — проверка устойчивости)"
lag_selection:
  method: fixed
  maxlag: 3
scenarios:
  - M1_rate: "банковский клин через Δ ключевой ставки"
  - M2_balance: "банковский клин через Δ баланса ответов об условиях кредитования"
  - M3_both: "оба прокси одновременно"
  - M4_levels: "уровни с линейным трендом (проверка не-спуриозности)"
  - sub_2021_2023: "подпериод до завершения льготной ипотеки"
  - sub_2024_2026: "подпериод действующего режима"
  - P1_pf_rate: "банковский клин через Δ фактической ставки проектного финансирования"
  - P2_pf_balance: "ставка ПФ и баланс ответов об условиях кредитования"
  - P3_pf_both: "ставка ПФ, баланс ответов и автолаги"
  - P4_pf_key_joint: "ставка ПФ и ключевая ставка одновременно (разделение каналов)"
  - P5_pf_levels: "уровни с трендом при ставке ПФ"
  - pf_sub_2022_2023, pf_sub_2024_2026: "подпериоды для ставки ПФ"
  - reverse_dRP_on_dG: "обратная регрессия Δставки ПФ на лаги Δg (проверка эндогенности)"
acceptance:
  - "n = 65 в базовых спецификациях (68 месяцев минус потери на лаги и разности)"
  - "ADF: g не отвергает единичный корень, Δg отвергает (p<0.05)"
  - "коэффициент при Δr > 0 при значимости по HAC-ошибкам (ожидание H-034)"
  - "коэффициент при Δ ставки ПФ > 0 — прямая проверка банковского клина"
  - "результат воспроизводится на ВМ без правок кода (только DSN)"
runner: scripts/h034_price_cost_gap.py
outputs:
  - models/transmission/h034-price-cost-gap-local-20261015.json
  - models/transmission/h034-price-cost-gap-vm-20261015.json
  - models/transmission/h034-price-cost-gap-pf-local-20261020.json
  - models/transmission/h034-price-cost-gap-pf-vm-20261020.json
notes: >
  Ключевое ограничение дизайна: и ставка, и условия кредитования коррелированы со
  спросом на жильё, поэтому коэффициент при Δr частично ловит не банковский клин, а
  спросовый канал (снижение ставки → рост спроса → ускорение цены).

  Прямая проверка (версия 2, 20.10.2026): ряд эффективной стоимости проектного
  финансирования загружен из месячных файлов ЦБ (cbr_pf_rate_ru_m, 2022-01…2026-09),
  и гипотеза по нему НЕ подтверждается: коэффициент при Δ ставки ПФ отрицателен
  (-0,0026, t=-1,4; в совместной спецификации с ключевой ставкой -0,0052, t=-3,3),
  подпериоды дают ноль. То есть наблюдаемый рост разрыва не объясняется динамикой
  фактической стоимости проектного финансирования, а положительный коэффициент при
  ключевой ставке — скорее спрос, чем издержки.

  Ограничение измерения, которое нельзя снимать без нового ряда: публикуемая ставка
  ПФ — средневзвешенная по портфелю действующих договоров, она инерционна (ставки
  фиксируются при заключении договора) и не равна предельной стоимости нового
  проекта. Для предельной ставки нужен ряд по новым договорам, которого в открытой
  статистике нет; следующий шаг — квартальные PDF «О проектном финансировании»
  (проверить, публикуется ли там ставка по новым договорам) либо опрос девелоперов.
